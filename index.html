function addStruct(kind,x,z,yaw,team,dims){const d={...STD[kind],...(dims||{})};const m=mesh(structGeo(kind,d));m.position.set(x,0,z);m.rotation.y=yaw;scene.add(m);const s={kind,x,z,yaw,hw:d.hw,hd:d.hd,h:d.h,hp:d.hp,team,mesh:m,t:0};structs.push(s);return s;}
function removeStruct(s){scene.remove(s.mesh);const i=structs.indexOf(s);if(i>=0)structs.splice(i,1);}
function hurtStruct(s,d){if(STD[s.kind].soft||s.hp>=1e9)return;s.hp-=d;if(s.hp<=0){for(let k=0;k<6;k++)splinter(s);removeStruct(s);sfx('crash',s);}}
const toLocal=(s,x,z)=>{const dx=x-s.x,dz=z-s.z,c=Math.cos(s.yaw),n=Math.sin(s.yaw);return[dx*c-dz*n,dx*n+dz*c];};
function structAt(x,y,z,pad){for(const s of structs){if(STD[s.kind].soft)continue;if(y>s.h)continue;const[lx,lz]=toLocal(s,x,z);if(Math.abs(lx)<s.hw+(pad||0)&&Math.abs(lz)<s.hd+(pad||0))return s;}return null;}
// 光線と箱（局所座標でスラブ判定）。当たった距離と構造物
function rayStruct(o,d,maxT){let best=null,bt=maxT;for(const s of structs){if(STD[s.kind].soft)continue;const c=Math.cos(s.yaw),n=Math.sin(s.yaw);const dx=o.x-s.x,dz=o.z-s.z;
  const O=[dx*c-dz*n,o.y,dx*n+dz*c],D=[d.x*c-d.z*n,d.y,d.x*n+d.z*c],lo=[-s.hw,0,-s.hd],hi=[s.hw,s.h,s.hd];let t0=0,t1=bt,ok=true;
  for(let a=0;a<3;a++){if(Math.abs(D[a])<1e-9){if(O[a]<lo[a]||O[a]>hi[a]){ok=false;break;}continue;}let ta=(lo[a]-O[a])/D[a],tb=(hi[a]-O[a])/D[a];if(ta>tb)[ta,tb]=[tb,ta];t0=Math.max(t0,ta);t1=Math.min(t1,tb);if(t0>t1){ok=false;break;}}
  if(ok&&t0<bt){bt=t0;best=s;}}return best?{s:best,t:bt}:null;}
// 体を構造物から押し出す
function collideStructs(u,r){for(const s of structs){if(STD[s.kind].soft||s.ladder||u.y>s.h-.2)continue;const[lx,lz]=toLocal(s,u.x,u.z);const px=s.hw+r-Math.abs(lx),pz=s.hd+r-Math.abs(lz);if(px<=0||pz<=0)continue;
  let nx=lx,nz=lz;if(px<pz)nx=Math.sign(lx||1)*(s.hw+r);else nz=Math.sign(lz||1)*(s.hd+r);const c=Math.cos(s.yaw),n=Math.sin(s.yaw);u.x=s.x+nx*c+nz*n;u.z=s.z-nx*n+nz*c;}}

$('#bQuit').onclick=()=>{$('#pause').classList.remove('on');$('#hud').style.display='none';$('#menu').classList.add('on');state='menu';};
$('#bAgain').onclick=()=>{$('#end').classList.remove('on');$('#menu').classList.add('on');state='menu';};
let selCls='A',selPt=0;const selLo={};CLS_KEYS.forEach(c=>{selLo[c]={...ARM_DEF[c],mods:{}};SLOT_K.forEach(k=>selLo[c][k]=CLS[c][k][0]);for(const w of CLS[c].main)if(MODS[w])selLo[c].mods[w]=modDef(w);});
$('#clsBtns').innerHTML=CLS_KEYS.map(k=>`<button class="btn sm" data-cls="${k}">${k}：${CLS[k].n}<br><small>${CLS[k].role}・体力${CLS[k].hp}</small></button>`).join('');
document.querySelectorAll('[data-cls]').forEach(b=>b.onclick=()=>{selCls=b.dataset.cls;renderDeploy();});
$('#loadout').onclick=e=>{const m=e.target.closest('[data-mod]');if(m){const[w,k,o]=m.dataset.mod.split('|');selLo[selCls].mods[w][k]=o;renderDeploy();return;}const b=e.target.closest('[data-w]');if(!b)return;selLo[selCls][b.dataset.k]=b.dataset.w;renderDeploy();};
$('#spawnmap').onclick=e=>{const r=e.target.getBoundingClientRect(),S=220,mx=(e.clientX-r.left)/r.width*S,my=(e.clientY-r.top)/r.height*S;const L=spawnPoints(myTeam);let bi=0,bd=1e9;
 L.forEach((p,i)=>{const[px,py]=mapXY(p.x,p.z,S);const d=Math.hypot(px-mx,py-my);if(d<bd){bd=d;bi=i;}});selPt=bi;renderDeploy();};
$('#bDeploy').onclick=()=>{if(player.respawn>0)return;const L=spawnPoints(myTeam);spawnUnit(player,selCls,L[Math.min(selPt,L.length-1)],JSON.parse(JSON.stringify(selLo[selCls])));$('#deploy').classList.remove('on');state='play';canvas.requestPointerLock();};
function openDeploy(first){if(document.pointerLockElement)document.exitPointerLock();state='deploy';$('#deploy').classList.add('on');if(first)player.respawn=0;selPt=0;renderDeploy();}
function modSummary(lo){const S=ws({lo:{...lo}},lo.main);const W=WPN[lo.main],t=[];if(W.gun)t.push(`威力${Math.round(S.dmg)}`,`装填${S.reload.toFixed(1)}秒`,`射程${Math.round(S.range)}m`,`ぶれ${(S.acc[0]*1000).toFixed(1)}`);if(W.cannon)t.push(`装填${S.reload.toFixed(1)}秒`,`破裂半径${S.rad.toFixed(1)}m`,`弾速${Math.round(S.spd)}`);if(W.bow)t.push(`最大威力${Math.round(S.max)}`,`引き${S.draw.toFixed(1)}秒`,`矢速${Math.round(S.spd)}`);if(S.slow&&S.slow!==1)t.push(`速さ${Math.round(S.slow*100)}%`);return`<div class="desc" style="margin-left:124px;color:#ffe8b0">${t.join('・')}</div>`;}
function renderDeploy(){document.querySelectorAll('[data-cls]').forEach(b=>b.classList.toggle('sel',b.dataset.cls===selCls));const L=spawnPoints(myTeam);if(selPt>=L.length)selPt=0;
 const lo=selLo[selCls];$('#loadout').innerHTML=SLOT_K.map((k,i)=>`<div class="lo-row"><span class="lbl">${i+1} ${SLOT_N[i]}</span>`+CLS[selCls][k].map(w=>`<button class="btn sm${lo[k]===w?' sel':''}" data-k="${k}" data-w="${w}" title="${WPN[w].d||''}">${WPN[w].n}</button>`).join('')+`<div class="desc">${WPN[lo[k]].d||''}</div></div>`+(k==='main'&&MODS[lo.main]?Object.keys(MODS[lo.main]).map(mk=>{const M0=MODS[lo.main][mk],cur=lo.mods[lo.main][mk];return`<div class="lo-row" style="margin-left:24px"><span class="lbl">└ 改造 ${M0.n}</span>`+Object.keys(M0.o).map(o=>`<button class="btn sm${cur===o?' sel':''}" data-mod="${lo.main}|${mk}|${o}">${M0.o[o].n}</button>`).join('')+`<div class="desc">${M0.o[cur].d||'標準'}</div></div>`;}).join('')+modSummary(lo):'')).join('')+ARM_K.map((k,i)=>`<div class="lo-row"><span class="lbl">鎧 ${ARM_N[i]}</span>`+Object.keys(ARM[k]).map(a=>`<button class="btn sm${lo[k]===a?' sel':''}" data-k="${k}" data-w="${a}">${ARM[k][a].n}</button>`).join('')+`<div class="desc">防御${Math.round(ARM[k][lo[k]].def*100)}%・重さ（速さ）-${Math.round(ARM[k][lo[k]].wt*100)}%　${ARM[k][lo[k]].d||''}</div></div>`).join('')+`<div class="desc" style="margin-left:0">合計: 移動速度 ${Math.round(armSpd({lo})*100)}%</div>`;
 $('#spawnT').textContent=player.respawn>0?`出陣まで ${Math.ceil(player.respawn)} 秒`:`出陣地点: ${L[selPt].n}`;$('#bDeploy').style.opacity=player.respawn>0?.4:1;
 const g=$('#spawnmap').getContext('2d');drawMap(g,220);L.forEach((p,i)=>{const[x,y]=mapXY(p.x,p.z,220);g.strokeStyle=i===selPt?'#ffe08a':'#fff';g.lineWidth=i===selPt?3:1.5;g.beginPath();g.arc(x,y,i===selPt?11:8,0,6.283);g.stroke();});}
function mapXY(x,z,S){return[(x+HALFX+8)/(2*HALFX+16)*S,(z+HALFZ+8)/(2*HALFZ+16)*S];}
function drawMap(g,S){g.clearRect(0,0,S,S);g.fillStyle='rgba(60,80,40,.9)';g.fillRect(0,0,S,S);const k=S/(2*HALFX+16);
 BASE.forEach((b,t)=>{const[x,y]=mapXY(b.x,b.z,S);g.fillStyle=TEAM[t].css;g.fillRect(x-26*k,y-5*k,52*k,10*k);});
 for(const s of structs){if(s.kind==='yakuro'||s.kind==='hashigo')continue;const[x,y]=mapXY(s.x,s.z,S);g.save();g.translate(x,y);g.rotate(-s.yaw);g.fillStyle=STD[s.kind].bld?(s.kind==='kura'?'#e8e4d8':s.kind==='noka'?'#b8a060':'#5a4a3e'):s.kind==='tree'?'#2e5a2a':s.kind==='rock'||s.kind==='ishigaki'?'#8a8880':s.kind==='take'?'#c8d080':s.ladder?'#e0c070':'#a08060';g.fillRect(-s.hw*k,-Math.max(1,s.hd*k),s.hw*2*k,Math.max(2,s.hd*2*k));g.restore();}
 for(const s of smokes){const[x,y]=mapXY(s.x,s.z,S);g.fillStyle='rgba(230,230,225,.6)';g.beginPath();g.arc(x,y,s.r*k,0,6.283);g.fill();}
 FLAGS.forEach(f=>{const[x,y]=mapXY(f.x,f.z,S);g.strokeStyle='rgba(255,255,255,.4)';g.beginPath();g.arc(x,y,CAP_R*k,0,6.283);g.stroke();g.fillStyle=f.owner<0?'#ddd':TEAM[f.owner].css;g.beginPath();g.arc(x,y,7,0,6.283);g.fill();g.fillStyle='#111';g.font='bold 10px serif';g.textAlign='center';g.textBaseline='middle';g.fillText(f.n,x,y+1);});
 for(const u of units){if(!u.alive)continue;const spotted=u.spotT>0&&u.spotBy===myTeam;const vis=u.team===myTeam||spotted||Math.hypot(u.x-player.x,u.z-player.z)<40;if(!vis)continue;const[x,y]=mapXY(u.x,u.z,S);
  if(u.isPlayer){g.fillStyle='#ffe08a';g.save();g.translate(x,y);g.rotate(-u.yaw);g.beginPath();g.moveTo(0,-6);g.lineTo(4,4);g.lineTo(-4,4);g.closePath();g.fill();g.restore();}
  else{g.fillStyle=TEAM[u.team].css;g.fillRect(x-2,y-2,4,4);if(spotted&&u.team!==myTeam){g.strokeStyle='#ff3a2a';g.strokeRect(x-4,y-4,8,8);}}}}
function renderBoard(){const h=[0,1].map(t=>{const L=units.filter(u=>u.team===t).sort((a,b)=>b.kills-a.kills);return`<table><tr><th style="color:${TEAM[t].css}">${TEAM[t].n}（${TEAM[t].lord}）残 ${tickets[t]}</th><th>兵科</th><th>討</th><th>死</th></tr>`+
 L.map(u=>`<tr class="${u.isPlayer?'me':''}"><td>${u.name}</td><td>${CLS[u.cls].n}</td><td>${u.kills}</td><td>${u.deaths}</td></tr>`).join('')+'</table>';});$('#board').innerHTML=h.join('');}
function endGame(win){if(state==='end')return;state='end';if(document.pointerLockElement)document.exitPointerLock();$('#deploy').classList.remove('on');
 $('#endT').textContent=win===myTeam?'勝利！':'敗北…';$('#endT').style.color=TEAM[win].css;$('#endS').textContent=`${TEAM[win].n}（${TEAM[win].lord}方）の勝ち ／ あなた ${player.kills}討 ${player.deaths}死`;$('#end').classList.add('on');sfx('horn');}
function updateHud(){$('#tk0').textContent=`東軍 ${tickets[0]}`;$('#tk1').textContent=`西軍 ${tickets[1]}`;
 $('#flags').innerHTML='<div style="display:flex;gap:6px">'+FLAGS.map(f=>{const p=Math.abs(f.prog),c=f.prog>0?TEAM[0].css:f.prog<0?TEAM[1].css:'#888';return`<div class="fl" style="border-color:${f.owner<0?'#fff':TEAM[f.owner].css}"><i style="height:${p}%;background:${c}"></i><span>${f.n}</span></div>`;}).join('')+'</div>';
 const u=player,mx=CLS[u.cls].hp;$('#hptxt').textContent=`${CLS[u.cls].n}（${CLS[u.cls].role}）体力 ${Math.max(0,Math.ceil(u.hp))} / ${mx}`+(u.buffT>0?'　奮起中':'');$('#hpbar i').style.width=clamp(u.hp/mx*100,0,100)+'%';$('#hpbar i').style.background=u.hp/mx<.3?'#e05a4a':'#e8e0c8';$('#stbar i').style.width=(u.stam||0)+'%';$('#stbar i').style.background=u.tired?'#c87a4a':'#a8d070';
 const w=curW(u),W=WPN[w];$('#ammoN').innerHTML=W.bow?`${u.ammo[w]}<small> 本</small>`:W.ammo?`${u.loaded[w]?1:0}<small> / ${u.ammo[w]}</small>`:W.item?`${u.items[w]||0}`:'';
 $('#wname').textContent=W.n+(aimOn?'（構え）':'')+(W.heavy?'　重い（構え中は動けない）':'')+(W.bow?'　右長押しで引く・左で放つ':'');
 $('#slots').innerHTML=slots(u).map((k,i)=>{const X=WPN[k];const cnt=X.bow?`${u.ammo[k]}`:X.ammo?`${(u.loaded[k]?1:0)+(u.ammo[k]||0)}`:X.item?`×${u.items[k]||0}`:'';const out=X.item&&!u.items[k];
  return`<div class="sl${i===u.w?' on':''}${out?' out':''}"><span class="k">${i+1}</span>${X.n}<span class="c">${cnt}</span></div>`;}).join('');
 const f=FLAGS.find(f=>Math.hypot(f.x-u.x,f.z-u.z)<CAP_R);const cap=$('#cap');if(f&&u.alive){cap.style.display='block';const mine=myTeam===0?f.prog:-f.prog;
  $('#captxt').textContent=`旗 味方${myTeam?f.n1:f.n0}・敵${myTeam?f.n0:f.n1}`+(f.owner===myTeam?'（自軍）':mine>0?'（占領中）':'（奪取中）');const bi=$('#capbar i');bi.style.background=f.prog>0?TEAM[0].css:TEAM[1].css;
  bi.style.width=Math.abs(f.prog)/2+'%';bi.style.left=f.prog>=0?'50%':(50-Math.abs(f.prog)/2)+'%';}else cap.style.display='none';
 drawMap($('#mini').getContext('2d'),170);}
// 薬籠の回復・梯子の後始末・兵の一時効果
function updateStructs(dt){for(const s of structs.slice()){if(s.kind==='hashigo'&&!structs.includes(s.fence)){removeStruct(s);continue;}if(s.kind!=='yakuro')continue;s.life-=dt;if(s.life<=0){removeStruct(s);continue;}
 for(const u of units)if(u.alive&&u.team===s.team&&Math.hypot(u.x-s.x,u.z-s.z)<4)u.hp=Math.min(CLS[u.cls].hp,u.hp+8*dt);}
 for(const u of units){u.buffT-=dt;u.slowT-=dt;u.spotT-=dt;}}

// ================= 音 =================
let AC=null;function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function vol(u){if(!u||u.isPlayer||!player)return 1;return clamp(1-Math.hypot(u.x-player.x,u.z-player.z)/120,0,1);}
function noise(dur,f,q,v,t0){const n=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length)**2;
 const s=AC.createBufferSource();s.buffer=n;const fl=AC.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f;fl.Q.value=q;const g=AC.createGain();g.gain.value=v;s.connect(fl);fl.connect(g);g.connect(AC.destination);s.start(AC.currentTime+(t0||0));}
function tone(type,f,f2,dur,v,t0){const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(t0||0);o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.05);}
function sfx(k,u){if(!AC)return;const v=vol(u);if(v<=.02)return;try{
 if(k==='gun'){noise(.6,500,.6,1.1*v);noise(.25,2200,.8,.5*v);}
 else if(k==='cannon'){noise(1.4,140,.5,1.8*v);noise(.5,600,.7,.8*v);}
 else if(k==='boom'){noise(1.2,180,.5,1.6*v);noise(.4,900,.7,.6*v);}
 else if(k==='bow'){tone('triangle',180,90,.18,.25*v);noise(.15,3000,1,.15*v);}
 else if(k==='xbow'){tone('square',140,70,.12,.2*v);noise(.1,2000,1,.3*v);}
 else if(k==='slash'){noise(.12,4000,2,.5*v);tone('square',900,500,.08,.08*v);}
 else if(k==='swish'){noise(.18,2500,1.5,.25*v);}
 else if(k==='thud'){noise(.12,400,1.5,.4*v);}
 else if(k==='crash'){noise(.8,300,.6,1.0*v);noise(.5,1200,.8,.5*v);}
 else if(k==='place'){noise(.15,500,2,.4*v);}
 else if(k==='hurt'){tone('sawtooth',200,90,.2,.18);}
 else if(k==='hitm'){tone('square',1400,1400,.05,.08);}
 else if(k==='cap'){tone('sine',520,520,.25,.2);tone('sine',780,780,.35,.2,.2);}
 else if(k==='click'){noise(.06,1800,3,.25);}
 else if(k==='ram'){for(let i=0;i<3;i++)noise(.08,900,4,.3,i*.6);}
 else if(k==='whistle'){tone('sine',1800,900,1.2,.12*v);tone('sine',2400,1300,1.2,.06*v);}
 else if(k==='puff'){noise(1.5,300,.5,.6*v);}
 else if(k==='horn'){tone('sawtooth',196,180,2.4,.12);tone('sine',392,360,2.4,.08);}}catch(e){}}

// ================= ループ =================
buildWorld();
let last=performance.now(),hudT=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;
 if(state==='play'||state==='deploy'){gameT+=dt;
  for(const u of units){u.cd-=dt;u.lastHit+=dt;if(u.alive&&u.lastHit>8&&u.hp<CLS[u.cls].hp)u.hp=Math.min(CLS[u.cls].hp,u.hp+6*dt);
   if(!u.alive){u.respawn-=dt;if(!u.isPlayer&&u.respawn<=0&&tickets[u.team]>0){const L=spawnPoints(u.team);const p=L.length>1&&Math.random()<.6?L[1]:L[0];spawnUnit(u,pick(CLS_KEYS),p);}}
   else if(!u.isPlayer)aiUpdate(u,dt);
   animUnit(u,dt);}
  if(state==='play')updatePlayer(dt);else if(state==='deploy'&&$('#deploy').classList.contains('on')){if(Math.floor(player.respawn+dt)!==Math.floor(player.respawn))renderDeploy();
   camera.position.set(BASE[myTeam].x,35,BASE[myTeam].z+(myTeam?-25:25));camera.rotation.set(-.6,myTeam?Math.PI:0,0);}
  updateArrows(dt);updateBombs(dt);updateStructs(dt);updateSmokes(dt);updateFx(dt);updateFlags(dt);hudT-=dt;if(hudT<=0){hudT=.12;updateHud();}
  sun.position.set(camera.position.x+60,110,camera.position.z+40);sun.target.position.set(camera.position.x,0,camera.position.z);}
 else if(state==='menu'){gameT+=dt;camera.position.set(Math.sin(gameT*.05)*80,25,Math.cos(gameT*.05)*80);camera.lookAt(0,0,0);}
 view.visible=state==='play'&&player&&player.alive;
 renderer.render(scene,camera);}
requestAnimationFrame(loop);
</script>
