<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>天下分け目 — TENKA WAKEME</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;color:#f2ead8;user-select:none}
canvas{display:block}
.scr{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(10,8,6,.78);z-index:20;text-align:center}
.scr.on{display:flex}
h1{font-size:64px;margin:0;letter-spacing:.2em;text-shadow:0 3px 0 #000}
.sub{opacity:.7;letter-spacing:.4em;margin-bottom:28px}
.btn{display:inline-block;margin:6px;padding:12px 26px;border:2px solid #d8c8a0;background:rgba(40,30,20,.85);color:#f2ead8;font-size:18px;cursor:pointer;font-family:inherit;min-width:150px}
.btn:hover{background:#5a4630}
.btn.sel{background:#8a6a3a;border-color:#ffe8b0}
.btn.east{border-color:#5a8ae0}.btn.west{border-color:#e05a4a}
.help{margin-top:22px;font-size:14px;opacity:.75;line-height:1.8}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;display:none}
#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px}
#cross:before,#cross:after{content:"";position:absolute;background:rgba(255,255,255,.85)}
#cross:before{left:8px;top:0;width:2px;height:18px}#cross:after{top:8px;left:0;height:2px;width:18px}
#hit{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;opacity:0;border:2px solid #fff;transform:rotate(45deg);transition:opacity .15s}
#top{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;font-size:22px;text-shadow:0 2px 0 #000}
.tk{min-width:90px;padding:4px 10px;border-radius:3px;text-align:center}
#tk0{background:rgba(42,90,168,.75)}#tk1{background:rgba(184,50,42,.75)}
.fl{width:34px;height:34px;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px;position:relative;overflow:hidden;background:#444}
.fl span{position:relative;z-index:2}.fl i{position:absolute;left:0;bottom:0;width:100%;z-index:1}
#cap{position:absolute;top:64px;left:50%;transform:translateX(-50%);width:260px;text-align:center;font-size:15px;display:none;text-shadow:0 1px 0 #000}
#capbar{height:8px;background:rgba(0,0,0,.5);margin-top:4px;position:relative}#capbar i{position:absolute;top:0;bottom:0;left:50%;width:0}
#hp{position:absolute;left:20px;bottom:16px;width:190px;font-size:14px;text-shadow:0 1px 0 #000}
#hpbar{height:10px;background:rgba(0,0,0,.55);margin-top:3px;border:1px solid rgba(240,230,200,.5)}#hpbar i{display:block;height:100%;background:#e8e0c8;width:100%;transition:width .15s}
#ammo{position:absolute;right:20px;bottom:16px;text-align:right;font-size:15px;text-shadow:0 1px 0 #000}
#ammo b{font-size:34px}#ammo small{font-size:16px;opacity:.75}
#slots{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.sl{width:66px;height:46px;border:1px solid rgba(240,230,200,.45);background:rgba(10,8,6,.45);position:relative;font-size:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1.2}
.sl.on{border:2px solid #ffe8b0;background:rgba(90,70,40,.6)}.sl .k{position:absolute;left:3px;top:1px;font-size:10px;opacity:.8}.sl .c{position:absolute;right:4px;bottom:1px;font-size:11px}.sl.out{opacity:.35}
#feed{position:absolute;right:16px;top:12px;font-size:14px;text-align:right;line-height:1.7;text-shadow:0 1px 0 #000}
#msg{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-size:26px;text-shadow:0 2px 0 #000;opacity:0;transition:opacity .4s;white-space:nowrap}
#mini{position:absolute;left:20px;bottom:52px;border:2px solid rgba(240,230,200,.6);background:rgba(20,30,15,.55)}
#dmg{position:absolute;inset:0;box-shadow:inset 0 0 120px rgba(200,0,0,.0);transition:box-shadow .3s}
#reload{position:absolute;left:50%;top:58%;transform:translateX(-50%);font-size:16px;text-shadow:0 1px 0 #000;display:none}
#board{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:15;background:rgba(15,12,8,.88);padding:16px 22px;display:none;gap:26px;font-size:14px}
#board.on{display:flex}#board table{border-collapse:collapse}#board td,#board th{padding:2px 10px;text-align:left;white-space:nowrap}#board tr.me{color:#ffe08a}
#spawnT{margin:10px 0;font-size:18px;min-height:24px}
#spawnmap{border:2px solid #d8c8a0;margin:8px;cursor:pointer;background:#2c3a22}
</style>
</head>
<body>
<div id="hud">
 <canvas id="mini" width="170" height="170"></canvas>
 <div id="dmg"></div>
 <div id="cross"></div><div id="hit"></div>
 <div id="top"><div class="tk" id="tk0">東軍 0</div><div id="flags"></div><div class="tk" id="tk1">西軍 0</div></div>
 <div id="cap"><div id="captxt"></div><div id="capbar"><i></i></div></div>
 <div id="feed"></div><div id="msg"></div><div id="reload">装填中…</div>
 <div id="hp"><div id="hptxt">侍 体力 100</div><div id="hpbar"><i></i></div></div>
 <div id="ammo"><div id="wname">刀</div><b id="ammoN"></b><div id="slots"></div></div>
</div>
<div id="board"></div>
<div class="scr on" id="menu">
 <h1>天下分け目</h1><div class="sub">TENKA WAKEME ― 関ヶ原 十六対十六</div>
 <div>陣営を選ぶ</div>
 <div><button class="btn east sel" data-team="0">東軍（徳川）</button><button class="btn west" data-team="1">西軍（石田）</button></div>
 <div style="margin-top:14px"><button class="btn" id="bStart">出陣</button></div>
 <div class="help">WASD 移動 / Shift 走る / Space 跳ぶ / マウス 視点<br>左クリック 攻撃（弓は押して引き絞り、離して射る）/ 右クリック 構える／戻す（弓・鉄砲）<br>1〜4 持ち替え（武器・焙烙玉・さらし）/ R 弾込め（鉄砲）/ Tab 戦況 / Esc 一時停止<br>旗（イ・ロ・ハ）の周りに留まると占領。相手の兵力（残り兵数）を0にすれば勝ち。</div>
</div>
<div class="scr" id="deploy">
 <h1 style="font-size:40px">出陣の準備</h1>
 <div id="spawnT"></div>
 <div>兵種</div>
 <div id="clsBtns"></div>
 <div style="margin-top:10px">出陣地点（地図をクリック）</div>
 <canvas id="spawnmap" width="260" height="260"></canvas>
 <div><button class="btn" id="bDeploy">出陣する</button></div>
</div>
<div class="scr" id="pause"><h1 style="font-size:44px">一時停止</h1><button class="btn" id="bResume">戻る</button><button class="btn" id="bQuit">退く（題名へ）</button></div>
<div class="scr" id="end"><h1 id="endT" style="font-size:52px"></h1><div id="endS" style="margin:14px"></div><button class="btn" id="bAgain">もう一戦</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// ================= 基本 =================
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const angWrap=a=>Math.atan2(Math.sin(a),Math.cos(a));
const TEAM=[{n:'東軍',c:0x2a5aa8,css:'#3a6ad0',lord:'徳川'},{n:'西軍',c:0xb8322a,css:'#d04a3a',lord:'石田'}];
const HALFX=170,HALFZ=175;
const FLAGS=[{n:'イ',x:-80,z:0},{n:'ロ',x:0,z:0},{n:'ハ',x:80,z:0}];
const BASE=[{x:0,z:150},{x:0,z:-150}];
const CAP_R=12,TICKETS=200,TEAM_N=16;
// 兵種
const CLS={
 samurai:{n:'侍',hp:120,spd:5.0,w:['katana']},
 yari:{n:'槍足軽',hp:100,spd:4.8,w:['yari','wakizashi']},
 yumi:{n:'弓足軽',hp:90,spd:4.8,w:['yumi','wakizashi']},
 teppo:{n:'鉄砲足軽',hp:90,spd:4.6,w:['teppo','wakizashi']}};
const CLS_KEYS=Object.keys(CLS);
const WPN={
 katana:{n:'刀',melee:1,dmg:45,range:2.5,cd:.75,ang:.7},
 yari:{n:'槍',melee:1,dmg:42,range:3.6,cd:.95,ang:.45,thrust:1},
 wakizashi:{n:'脇差',melee:1,dmg:30,range:2.1,cd:.55,ang:.7},
 yumi:{n:'弓',bow:1,dmg:35,cd:.9,ammo:30,draw:.8},
 teppo:{n:'火縄銃',gun:1,dmg:45,cd:.3,ammo:20,reload:20,range:160},
 horoku:{n:'焙烙玉',throw:1,dmg:110,rad:7,fuse:2.6,cd:1},
 sarashi:{n:'さらし',heal:1,amt:60,time:2.5,cd:.5}};
const ITEMS={horoku:2,sarashi:2};
const NAMES=['太郎兵衛','与四郎','弥助','源八','権六','孫三郎','甚五郎','又兵衛','新左衛門','彦七','藤吉','半蔵','喜平次','左近','勘助','市松','虎之助','才蔵','十兵衛','茂助','吉蔵','伝八','清右衛門','久六','八郎','長吉','小平太','善兵衛','佐吉','忠三郎','五郎作','平八'];

// ================= three.js =================
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
const canvas=renderer.domElement;
const scene=new THREE.Scene();scene.background=new THREE.Color(0xbcd6e8);scene.fog=new THREE.Fog(0xbcd6e8,60,320);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,600);camera.rotation.order='YXZ';scene.add(camera);
scene.add(new THREE.HemisphereLight(0xdfeeff,0x5a6a3a,.75));
const sun=new THREE.DirectionalLight(0xfff2dc,.85);sun.position.set(60,110,40);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-90,right:90,top:90,bottom:-90,near:10,far:300});scene.add(sun);scene.add(sun.target);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
const MAT=new THREE.MeshLambertMaterial({vertexColors:true});
// 部品をまとめて1つのジオメトリにする（頂点色つき）
function P(geo,col,o){o=o||{};const g=geo.index?geo.toNonIndexed():geo.clone();
 g.applyMatrix4(new THREE.Matrix4().compose(new THREE.Vector3(o.x||0,o.y||0,o.z||0),new THREE.Quaternion().setFromEuler(new THREE.Euler(o.rx||0,o.ry||0,o.rz||0)),new THREE.Vector3(o.sx||1,o.sy||1,o.sz||1)));
 const c=new THREE.Color(col),n=g.attributes.position.count,a=new Float32Array(n*3);for(let i=0;i<n;i++){a[i*3]=c.r;a[i*3+1]=c.g;a[i*3+2]=c.b;}g.setAttribute('color',new THREE.BufferAttribute(a,3));return g;}
function M(parts){let n=0;parts.forEach(g=>n+=g.attributes.position.count);const pos=new Float32Array(n*3),nor=new Float32Array(n*3),col=new Float32Array(n*3);let o=0;
 parts.forEach(g=>{pos.set(g.attributes.position.array,o*3);nor.set(g.attributes.normal.array,o*3);col.set(g.attributes.color.array,o*3);o+=g.attributes.position.count;});
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('normal',new THREE.BufferAttribute(nor,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));return g;}
const B=(w,h,d,c,o)=>P(new THREE.BoxGeometry(w,h,d),c,o);
const mesh=(g,sh)=>{const m=new THREE.Mesh(g,MAT);m.castShadow=sh!==false;m.receiveShadow=true;return m;};

// ================= 地面と装飾 =================
function buildWorld(){
 const S=420,N=84,g=new THREE.PlaneGeometry(S*2,S*2,N,N);g.rotateX(-Math.PI/2);const ng=g.toNonIndexed();const pa=ng.attributes.position.array,col=new Float32Array(pa.length),c=new THREE.Color();
 for(let i=0;i<pa.length;i+=9){const x=(pa[i]+pa[i+3]+pa[i+6])/3,z=(pa[i+2]+pa[i+5]+pa[i+8])/3;const n=Math.sin(x*.05)*Math.cos(z*.043)+Math.sin(x*.13+z*.09)*.5;
  c.set(Math.abs(x)>HALFX||Math.abs(z)>HALFZ?'#6e8a46':'#7d9a4a').offsetHSL(0,0,n*.025+(Math.random()-.5)*.02);for(let k=0;k<3;k++){col[i+k*3]=c.r;col[i+k*3+1]=c.g;col[i+k*3+2]=c.b;}}
 ng.setAttribute('color',new THREE.BufferAttribute(col,3));ng.computeVertexNormals();const gm=new THREE.Mesh(ng,MAT);gm.receiveShadow=true;scene.add(gm);
 // 外周の木
 const tg=M([B(.4,3,.4,'#5a4030',{y:1.5}),P(new THREE.ConeGeometry(2.2,4.5,7),'#3e6a2c',{y:4.6}),P(new THREE.ConeGeometry(1.7,3.5,7),'#4a7a34',{y:6.4})]);
 const T=[];for(let k=0;k<420;k++){const a=Math.random()*6.283,r=rnd(205,330);T.push([Math.cos(a)*r*1.05,Math.sin(a)*r]);}
 for(let k=0;k<60;k++){T.push([rnd(-1,1)*HALFX,(Math.random()<.5?1:-1)*rnd(178,200)]);T.push([(Math.random()<.5?1:-1)*rnd(176,200),rnd(-1,1)*HALFZ]);}
 const im=new THREE.InstancedMesh(tg,MAT,T.length);im.castShadow=true;const m4=new THREE.Matrix4(),q=new THREE.Quaternion(),v=new THREE.Vector3(),sc=new THREE.Vector3();
 T.forEach(([x,z],i)=>{const s=rnd(.8,1.4);q.setFromAxisAngle(new THREE.Vector3(0,1,0),Math.random()*6);m4.compose(v.set(x,0,z),q,sc.set(s,s,s));im.setMatrixAt(i,m4);});scene.add(im);
 // 本陣: 陣幕と幟
 BASE.forEach((b,t)=>{const s=t?-1:1;const curtain=M([B(26,2.2,.15,'#f2ece0',{y:1.1}),B(26,.5,.16,TEAM[t].css,{y:.5}),B(26,.5,.16,TEAM[t].css,{y:1.8}),P(new THREE.CircleGeometry(.7,16),'#1a1a1a',{y:1.15,z:.09*s,ry:t?Math.PI:0})]);
  const c1=mesh(curtain);c1.position.set(b.x,0,b.z+10*s);scene.add(c1);
  for(const sx of[-1,1]){const c2=mesh(M([B(14,2.2,.15,'#f2ece0',{y:1.1}),B(14,.5,.16,TEAM[t].css,{y:.5}),B(14,.5,.16,TEAM[t].css,{y:1.8})]));c2.position.set(b.x+sx*13,0,b.z+3*s);c2.rotation.y=Math.PI/2;scene.add(c2);}
  for(let k=0;k<8;k++){const n=mesh(M([B(.08,5,.08,'#3a2a1a',{y:2.5}),B(.06,.06,1.0,'#3a2a1a',{y:4.9,z:.5}),B(.04,3.4,1.0,TEAM[t].css,{y:3.2,z:.5}),B(.045,.5,1.0,'#f2ece0',{y:4.4,z:.5})]));n.position.set(b.x-12+k*24/7,0,b.z-6*s);n.rotation.y=Math.random()*.4;scene.add(n);}});
 // 旗
 FLAGS.forEach((f,i)=>{const g=new THREE.Group();g.add(mesh(M([B(.16,7,.16,'#4a3a2a',{y:3.5}),P(new THREE.CylinderGeometry(1.2,1.5,.4,8),'#8a7a5a',{y:.2})])));
  const cv=document.createElement('canvas');cv.width=cv.height=64;const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,64,64);cx.fillStyle='#111';cx.font='bold 44px serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(f.n,32,34);
  const mat=new THREE.MeshLambertMaterial({map:new THREE.CanvasTexture(cv),side:THREE.DoubleSide,color:0xdddddd});const ban=new THREE.Mesh(new THREE.PlaneGeometry(1.6,3.2),mat);ban.position.set(0,5,.85);ban.rotation.y=Math.PI/2;ban.castShadow=true;g.add(ban);
  const ring=new THREE.Mesh(new THREE.RingGeometry(CAP_R-.25,CAP_R,64),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.35}));ring.rotation.x=-Math.PI/2;ring.position.y=.03;g.add(ring);
  g.position.set(f.x,0,f.z);scene.add(g);f.mat=mat;f.ring=ring;f.ban=ban;});
}

// ================= 兵の見た目 =================
const SKIN='#d8b090',DARK='#2a2420',CLOTH='#3a3a44';
function weaponGeo(w){switch(w){
 case'katana':return M([B(.04,.25,.05,'#2a1a10',{y:0}),B(.12,.03,.1,'#8a7a40',{y:.13}),B(.02,.85,.05,'#d8dce0',{y:.57,rz:.03})]);
 case'wakizashi':return M([B(.04,.2,.05,'#2a1a10'),B(.1,.03,.09,'#8a7a40',{y:.11}),B(.02,.55,.045,'#d8dce0',{y:.4})]);
 case'yari':return M([B(.05,3.0,.05,'#5a3a20',{y:.6}),P(new THREE.ConeGeometry(.05,.4,4),'#d8dce0',{y:2.3})]);
 case'yumi':{const p=[];for(let k=0;k<9;k++){const t=(k-4)/4,a=t*.9;p.push(B(.04,.26,.05,'#3a2a1a',{y:Math.sin(a)*1.0,z:(Math.cos(a)-1)*-.35,rx:a}));}p.push(B(.008,2.0,.008,'#f0e8d0',{z:-.25}));return M(p);}
 case'horoku':return M([P(new THREE.IcosahedronGeometry(.11,1),'#2a2622'),B(.02,.08,.02,'#c8a878',{y:.13}),B(.05,.03,.05,'#6a5a40',{y:.1})]);
 case'sarashi':return M([P(new THREE.CylinderGeometry(.07,.07,.14,10),'#f2ece0',{rz:Math.PI/2}),B(.12,.005,.2,'#f2ece0',{y:-.07,z:.1})]);
 case'teppo':return M([B(.06,.06,1.25,'#2a2a2a',{z:.35}),B(.09,.12,.75,'#6a4024',{z:-.05,y:-.03}),B(.08,.18,.3,'#6a4024',{z:-.52,y:-.08}),B(.03,.03,.1,'#8a7a40',{z:-.05,y:.06})]);}}
function makeSoldier(team,cls){const C=TEAM[team].css,g=new THREE.Group();
 const torso=new THREE.Group();torso.position.y=1.0;g.add(torso);
 const helm=cls==='samurai'?[B(.36,.16,.36,DARK,{y:.78}),B(.5,.04,.46,DARK,{y:.7}),P(new THREE.ConeGeometry(.04,.32,3),'#c8a040',{y:.98,z:.12,rz:.6}),P(new THREE.ConeGeometry(.04,.32,3),'#c8a040',{y:.98,z:.12,rz:-.6})]
  :[P(new THREE.ConeGeometry(.36,.16,10),DARK,{y:.8})];
 torso.add(mesh(M([B(.5,.62,.3,C,{y:.31}),B(.52,.16,.32,DARK,{y:.05}),B(.56,.12,.34,DARK,{y:.6}),B(.6,.08,.3,C,{y:.62,x:0}),
  B(.26,.26,.26,SKIN,{y:.82}),B(.27,.06,.02,'#1a1a1a',{y:.84,z:.135}),...helm,
  B(.03,1.4,.03,'#3a2a1a',{y:.95,z:-.2}),B(.02,.75,.5,C,{y:1.2,z:-.2}),B(.025,.22,.5,'#f2ece0',{y:1.48,z:-.2})])));
 const mkArm=x=>{const a=new THREE.Group();a.position.set(x,.56,0);a.add(mesh(M([B(.15,.5,.15,C,{y:-.2}),B(.12,.12,.12,SKIN,{y:-.5})])));torso.add(a);return a;};
 const armR=mkArm(.33),armL=mkArm(-.33);
 const mkLeg=x=>{const l=new THREE.Group();l.position.set(x,1.0,0);l.add(mesh(M([B(.18,.52,.2,CLOTH,{y:-.26}),B(.15,.44,.17,'#e8e0d0',{y:-.74}),B(.17,.08,.26,'#5a4a30',{y:-.97,z:.04})])));g.add(l);return l;};
 const legR=mkLeg(.13),legL=mkLeg(-.13);
 const wpn=new THREE.Group();wpn.position.y=-.5;armR.add(wpn);
 return{g,torso,armR,armL,legR,legL,wpn,wId:null};}
function setWeaponMesh(v,w){if(v.wId===w)return;v.wId=w;v.wpn.clear();const m=mesh(weaponGeo(w));
 if(w==='yari'){m.rotation.x=Math.PI/2;m.position.set(0,0,-.2);}else if(w==='teppo'){m.position.set(0,0,.1);}else if(w==='yumi'){m.position.set(0,0,0);}else{m.rotation.x=Math.PI/2.4;}v.wpn.add(m);}

// ================= 兵 =================
const units=[];let player=null;
const tickets=[TICKETS,TICKETS];
function newUnit(team,isPlayer,name){const u={team,isPlayer,name,cls:'yari',x:0,z:0,y:0,vy:0,yaw:0,pitch:0,hp:100,alive:false,respawn:isPlayer?0:rnd(.5,3),
 w:0,cd:0,ammo:{},loaded:{},reloadT:0,draw:0,drawing:false,aimT:0,kills:0,deaths:0,lastHit:99,ph:Math.random()*6,spd:0,atkT:-1,vis:null,
 items:{...ITEMS},healT:0,ai:{flag:null,tgt:null,think:0,strafe:Math.random()<.5?1:-1,ox:rnd(-6,6),oz:rnd(-6,6)}};units.push(u);return u;}

 c.w.forEach(w=>{if(WPN[w].ammo){u.ammo[w]=WPN[w].ammo;u.loaded[w]=1;}});u.items={...ITEMS};u.healT=0;if(u.isPlayer)mouseR=false;
 const p=pt||spawnPoints(u.team)[0];u.x=p.x+rnd(-5,5);u.z=p.z+rnd(-5,5);u.y=0;u.yaw=u.team===0?0:Math.PI;u.pitch=0;

function spawnPoints(t){const L=[{n:'本陣',x:BASE[t].x,z:BASE[t].z}];FLAGS.forEach(f=>{if(f.owner===t)L.push({n:f.n,x:f.x+(t?-1:1)*0,z:f.z+(t?-8:8)});});return L;}

 tickets[0]=tickets[1]=TICKETS;FLAGS.forEach(f=>{f.owner=-1;f.prog=0;});gameT=0;bleedT=0;feedL=[];renderFeed();
 const nm=NAMES.slice().sort(()=>Math.random()-.5);let k=0;
 for(let t=0;t<2;t++)for(let i=0;i<TEAM_N;i++){if(t===myTeam&&i===0){player=newUnit(t,true,'あなた');continue;}const u=newUnit(t,false,nm[k++%nm.length]);u.cls=CLS_KEYS[[0,1,1,1,2,2,3,3][i%8]];}}
function killUnit(u,by,head){if(!u.alive)return;u.alive=false;u.deaths++;u.respawn=u.isPlayer?7:rnd(6,9);tickets[u.team]=Math.max(0,tickets[u.team]-1);
 if(by){by.kills++;addFeed(by,u,head);}if(u.vis){u.vis.deadT=0;}
 if(u.isPlayer){openDeploy();}if(by&&by.isPlayer){flashMsg((head?'討ち取った！（頭）':'討ち取った！'),900);}}
function damage(u,dmg,by,head){if(!u.alive||(by&&by.team===u.team))return;if(head)dmg=9999;u.hp-=dmg;u.lastHit=0;if(by&&!u.isPlayer){u.ai.tgt=by;}
 if(u.isPlayer){$('#dmg').style.boxShadow='inset 0 0 140px rgba(200,0,0,.65)';setTimeout(()=>$('#dmg').style.boxShadow='inset 0 0 120px rgba(200,0,0,0)',250);sfx('hurt');}
 if(by&&by.isPlayer){const h=$('#hit');h.style.opacity=1;h.style.borderColor=head?'#ff5040':'#fff';setTimeout(()=>h.style.opacity=0,120);sfx('hitm');}
 if(u.hp<=0)killUnit(u,by,head);}

function updateFlags(dt){FLAGS.forEach(f=>{const n=[0,0];units.forEach(u=>{if(u.alive&&Math.hypot(u.x-f.x,u.z-f.z)<CAP_R)n[u.team]++;});f.n0=n[0];f.n1=n[1];
  const d=n[0]-n[1];if(d!==0){const r=Math.min(3,Math.abs(d))*7*dt*Math.sign(d);const before=f.prog;f.prog=clamp(f.prog+r,-100,100);
   if(f.owner===1&&f.prog>0||f.owner===0&&f.prog<0){const lost=f.owner;f.owner=-1;if(lost===myTeam)flashMsg(`旗「${f.n}」が奪われた`);}
   if(f.prog>=100&&f.owner!==0){f.owner=0;flashMsg(`${TEAM[0].n}が旗「${f.n}」を占領`);sfx('cap');}

 bleedT+=dt;if(bleedT>3){bleedT=0;const c=[0,0];FLAGS.forEach(f=>{if(f.owner>=0)c[f.owner]++;});if(c[0]>c[1])tickets[1]=Math.max(0,tickets[1]-(c[0]-c[1]));else if(c[1]>c[0])tickets[0]=Math.max(0,tickets[0]-(c[1]-c[0]));}
 if(tickets[0]<=0||tickets[1]<=0)endGame(tickets[0]<=0?1:0);}

const arrows=[];const arrowGeo=M([B(.02,.02,.85,'#c8a878',{z:0}),P(new THREE.ConeGeometry(.025,.1,4),'#555',{z:.47,rx:Math.PI/2}),B(.005,.06,.12,'#f0f0f0',{z:-.38})]);
function fireArrow(u,ox,oy,oz,dir,spd){const m=mesh(arrowGeo,false);scene.add(m);arrows.push({u,p:new THREE.Vector3(ox,oy,oz),v:dir.clone().multiplyScalar(spd),m,t:0,stuck:0});sfx('bow',u);}
function unitHitTest(p,team){for(const u of units){if(!u.alive||u.team===team)continue;const dx=p.x-u.x,dz=p.z-u.z;if(dx*dx+dz*dz<.16&&p.y>u.y&&p.y<u.y+1.95)return u;}return null;}
function updateArrows(dt){for(let i=arrows.length-1;i>=0;i--){const a=arrows[i];a.t+=dt;if(a.stuck){if(a.t>12){scene.remove(a.m);arrows.splice(i,1);}continue;}
 for(let s=0;s<3;s++){a.v.y-=9.8*dt/3;a.p.addScaledVector(a.v,dt/3);const h=unitHitTest(a.p,a.u.team);if(h){const head=a.p.y-h.y>1.6;damage(h,WPN.yumi.dmg,a.u,head);scene.remove(a.m);arrows.splice(i,1);break;}
  if(a.p.y<=0){a.p.y=.05;a.stuck=1;a.t=0;break;}}
 if(arrows[i]!==a)continue;a.m.position.copy(a.p);a.m.lookAt(a.p.x+a.v.x,a.p.y+a.v.y,a.p.z+a.v.z);if(a.p.x*a.p.x+a.p.z*a.p.z>400*400){scene.remove(a.m);arrows.splice(i,1);}}}

function shootRay(u,o,d){let best=null,bt=WPN.teppo.range,head=false;for(const v of units){if(!v.alive||v.team===u.team)continue;
  const ox=o.x-v.x,oz=o.z-v.z,a=d.x*d.x+d.z*d.z,b=2*(ox*d.x+oz*d.z),c=ox*ox+oz*oz-.13;const disc=b*b-4*a*c;if(disc<0)continue;const t=(-b-Math.sqrt(disc))/(2*a);if(t<0||t>bt)continue;
  const y=o.y+d.y*t-v.y;if(y<0||y>1.95)continue;bt=t;best=v;head=y>1.62;}
 const end=o.clone().addScaledVector(d,best?bt:Math.min(bt,o.y>0&&d.y<0?-o.y/d.y:bt));tracer(o,end);smoke(o.clone().addScaledVector(d,1.2));sfx('gun',u);
 if(best)damage(best,WPN.teppo.dmg,u,head);}

 b.m.position.copy(b.p);b.m.rotation.x+=dt*6;if(b.t<WPN.horoku.fuse)continue;scene.remove(b.m);bombs.splice(i,1);
 for(const v of units){if(!v.alive||v.team===b.u.team)continue;const d=Math.hypot(v.x-b.p.x,v.z-b.p.z,v.y+1-b.p.y);if(d<WPN.horoku.rad)damage(v,WPN.horoku.dmg*(1-d/WPN.horoku.rad)+10,b.u,false);}
 const fl=new THREE.Mesh(new THREE.IcosahedronGeometry(1.5,1),new THREE.MeshBasicMaterial({color:0xffa040,transparent:true,opacity:.9}));fl.position.copy(b.p);scene.add(fl);fx.push({m:fl,t:0,life:.3,boom:1});smoke(b.p.clone().setY(.6));smoke(b.p.clone().setY(1.2));sfx('boom',b.u);}}
const fx=[];
function tracer(a,b){const g=new THREE.BufferGeometry().setFromPoints([a,b]);const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:0xfff0c0,transparent:true,opacity:.6}));scene.add(l);fx.push({m:l,t:0,life:.08});}
const smokeGeo=new THREE.IcosahedronGeometry(.5,0);
function smoke(p){for(let k=0;k<4;k++){const m=new THREE.Mesh(smokeGeo,new THREE.MeshLambertMaterial({color:0xdddddd,transparent:true,opacity:.6}));m.position.copy(p).add(new THREE.Vector3(rnd(-.3,.3),rnd(-.2,.3),rnd(-.3,.3)));scene.add(m);fx.push({m,t:0,life:2.2,smoke:1});}}
function updateFx(dt){for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t+=dt;if(f.boom){f.m.scale.setScalar(1+f.t*8);f.m.material.opacity=.9*(1-f.t/f.life);}else if(f.smoke){f.m.scale.setScalar(1+f.t*1.6);f.m.position.y+=dt*.5;f.m.material.opacity=.6*(1-f.t/f.life);}else f.m.material.opacity=.6*(1-f.t/f.life);
 if(f.t>=f.life){scene.remove(f.m);f.m.geometry!==smokeGeo&&f.m.geometry.dispose();f.m.material.dispose();fx.splice(i,1);}}}
function meleeHit(u,yaw,w){const W=WPN[w];let best=null,bd=1e9;for(const v of units){if(!v.alive||v.team===u.team)continue;const dx=v.x-u.x,dz=v.z-u.z,d=Math.hypot(dx,dz);if(d>W.range+.35)continue;
  const a=Math.abs(angWrap(Math.atan2(-dx,-dz)-yaw));if(a>W.ang)continue;if(d<bd){bd=d;best=v;}}
 if(best){damage(best,W.dmg,u,false);sfx('slash',u);}else sfx('swish',u);}

function nearestEnemy(u,maxd){let best=null,bd=maxd;for(const v of units){if(!v.alive||v.team===u.team)continue;const d=Math.hypot(v.x-u.x,v.z-u.z);if(d<bd){bd=d;best=v;}}return best;}
function pickFlag(u){const t=u.team;let L=FLAGS.map(f=>{const d=Math.hypot(f.x-u.x,f.z-u.z);let s=d;if(f.owner===t)s+=f[t?'n0':'n1']>0?-30:140;else if(f.owner<0)s-=20;return{f,s:s+rnd(0,60)};});L.sort((a,b)=>a.s-b.s);return L[0].f;}
function aiThink(u){const ai=u.ai,w=curW(u),W=WPN[w];const aggro=W.gun?120:W.bow?85:45;
 if(!ai.tgt||!ai.tgt.alive||Math.hypot(ai.tgt.x-u.x,ai.tgt.z-u.z)>aggro*1.2)ai.tgt=nearestEnemy(u,aggro);
 if(!ai.flag||ai.flag.owner===u.team&&Math.random()<.3||Math.random()<.08)ai.flag=pickFlag(u);
 // 近すぎたら脇差に持ち替え
 const cw=CLS[u.cls].w;if(cw.length>1&&ai.tgt){const d=Math.hypot(ai.tgt.x-u.x,ai.tgt.z-u.z);const want=(d<5)?1:0;if(u.w!==want&&!u.drawing){u.w=want;setWeaponMesh(u.vis,cw[want]);}}
 if(Math.random()<.2)ai.strafe*=-1;}
function aiUpdate(u,dt){const ai=u.ai;ai.think-=dt;if(ai.think<=0){ai.think=rnd(.35,.6);aiThink(u);}
 const w=curW(u),W=WPN[w];let mx=0,mz=0,run=true,face=null;
 const t=ai.tgt&&ai.tgt.alive?ai.tgt:null;let engaged=false;
 if(t){const dx=t.x-u.x,dz=t.z-u.z,d=Math.hypot(dx,dz);face=Math.atan2(-dx,-dz);
  if(W.melee){engaged=d<W.range+2;if(d>W.range*.8){mx=dx/d;mz=dz/d;}else{mx=dz/d*ai.strafe*.3;mz=-dx/d*ai.strafe*.3;run=false;}
   if(d<W.range&&u.cd<=0&&Math.abs(angWrap(face-u.yaw))<.4){u.cd=W.cd*rnd(1,1.4);u.atkT=0;meleeHit(u,u.yaw,w);}}
  else{const want=W.gun?rnd(35,80):rnd(25,55);run=false;
   if(d>want+15){mx=dx/d;mz=dz/d;run=true;}else if(d<14){mx=-dx/d;mz=-dz/d;run=true;}else{mx=dz/d*ai.strafe*.25;mz=-dx/d*ai.strafe*.25;engaged=true;}
   if(W.gun){if(u.loaded.teppo){u.aimT+=dt;if(u.aimT>rnd(1.2,2.4)&&Math.abs(angWrap(face-u.yaw))<.15){u.aimT=0;u.loaded.teppo=0;
      const o=new THREE.Vector3(u.x,u.y+1.55,u.z),tg=new THREE.Vector3(t.x+rnd(-.1,.1),t.y+rnd(.9,1.75),t.z);const dir=tg.sub(o).normalize();const err=.012+d*.00045;dir.x+=rnd(-err,err);dir.y+=rnd(-err,err);dir.z+=rnd(-err,err);dir.normalize();shootRay(u,o,dir);u.atkT=0;}}
    else if(u.ammo.teppo>0){u.reloadT+=dt;mx*=.4;mz*=.4;if(u.reloadT>WPN.teppo.reload){u.reloadT=0;u.loaded.teppo=1;u.ammo.teppo--;}}}
   else if(W.bow){if(u.ammo.yumi>0&&u.cd<=0){u.drawing=true;u.draw+=dt;if(u.draw>rnd(1.0,1.6)&&Math.abs(angWrap(face-u.yaw))<.15){u.drawing=false;u.draw=0;u.cd=W.cd;u.ammo.yumi--;
      const spd=42,o=new THREE.Vector3(u.x,u.y+1.5,u.z);const lt=d/spd;const px=t.x+(t.vx||0)*lt,pz=t.z+(t.vz||0)*lt,dd=Math.hypot(px-u.x,pz-u.z);
      const s=clamp(9.8*dd/(spd*spd),-1,1),el=.5*Math.asin(s)+((t.y+1.1)-o.y)/Math.max(dd,1)+rnd(-.025,.025);const hy=Math.atan2(-(px-u.x),-(pz-u.z))+rnd(-.03,.03);
      const dir=new THREE.Vector3(-Math.sin(hy)*Math.cos(el),Math.sin(el),-Math.cos(hy)*Math.cos(el));fireArrow(u,o.x,o.y,o.z,dir,spd);u.atkT=0;}}}}}
 else if(ai.flag){u.drawing=false;u.draw=0;const tx=ai.flag.x+ai.ox,tz=ai.flag.z+ai.oz,dx=tx-u.x,dz=tz-u.z,d=Math.hypot(dx,dz);if(d>2.5){mx=dx/d;mz=dz/d;face=Math.atan2(-dx,-dz);run=d>15;}else if(Math.random()<.01){ai.ox=rnd(-7,7);ai.oz=rnd(-7,7);}}
 // 群れすぎない
 for(const v of units){if(v===u||!v.alive)continue;const dx=u.x-v.x,dz=u.z-v.z,d2=dx*dx+dz*dz;if(d2<1.2&&d2>1e-4){const d=Math.sqrt(d2);mx+=dx/d*.8;mz+=dz/d*.8;}}
 {const ml0=Math.hypot(mx,mz);if(ml0>.3&&!engaged)face=Math.atan2(-mx,-mz);}
 if(face!=null){const da=angWrap(face-u.yaw);u.yaw+=clamp(da,-6*dt,6*dt);}
 const ml=Math.hypot(mx,mz);const sp=CLS[u.cls].spd*(run?1.25:.75)*(u.drawing?.5:1);
 if(ml>.01){u.vx=mx/ml*sp;u.vz=mz/ml*sp;}else{u.vx=0;u.vz=0;}
 u.x=clamp(u.x+u.vx*dt,-HALFX,HALFX);u.z=clamp(u.z+u.vz*dt,-HALFZ,HALFZ);u.spd=ml>.01?sp:0;}

function animUnit(u,dt){const v=u.vis;if(!v)return;
 if(!u.alive){v.deadT=(v.deadT||0)+dt;const k=Math.min(1,v.deadT*2.5);v.g.rotation.set(0,u.yaw,0);v.g.rotation.x=-k*Math.PI/2*.98;v.g.position.y=u.y+k*.15;if(v.deadT>9){v.g.position.y-= (v.deadT-9)*.6;}return;}
 v.g.position.set(u.x,u.y,u.z);v.g.rotation.set(0,u.yaw,0);u.ph+=dt*u.spd*1.6;const amp=Math.min(1,u.spd/4)*.7;
 v.legR.rotation.x=Math.sin(u.ph)*amp;v.legL.rotation.x=-Math.sin(u.ph)*amp;v.armL.rotation.x=Math.sin(u.ph)*amp*.6;v.torso.position.y=1.0+Math.abs(Math.cos(u.ph))*.04*amp;
 const w=curW(u);let ar=-.4,az=0;
 if(w==='yari'){ar=-1.45;}else if(w==='teppo'){ar=-1.5;v.armL.rotation.x=-1.4;}else if(w==='yumi'){ar=-1.5;v.armL.rotation.x=-1.5;}
 if(u.atkT>=0){u.atkT+=dt;const p=u.atkT/.35;if(p>=1)u.atkT=-1;else if(WPN[w].melee){if(w==='yari')ar=-1.45;else ar=-2.6+p*2.4;}}
 if(u.drawing&&w==='yumi')v.armR.position.z=.0-Math.min(1,u.draw)*.25;else v.armR.position.z=0;
 v.armR.rotation.x=ar;v.armR.rotation.z=az;
 if(w==='yari')v.wpn.position.z=u.atkT>=0?Math.sin(Math.min(1,u.atkT/.35)*Math.PI)*.9:0;else v.wpn.position.z=0;}

function updatePlayer(dt){const u=player;if(!u.alive)return;const W=WPN[curW(u)],w=curW(u);
 let f=(keys.KeyW?1:0)-(keys.KeyS?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0);const ml=Math.hypot(f,s);const run=keys.ShiftLeft&&f>0;if(run&&mouseR)mouseR=false;
 const sp=CLS[u.cls].spd*(run?1.4:1)*(mouseR?.55:1)*(u.drawing?.6:1)*(u.healT>0?.4:1);
 if(ml>0){f/=ml;s/=ml;const sx=Math.sin(u.yaw),cz=Math.cos(u.yaw);u.vx=(-sx*f+cz*s)*sp;u.vz=(-cz*f-sx*s)*sp;}else{u.vx=0;u.vz=0;}
 u.x=clamp(u.x+u.vx*dt,-HALFX,HALFX);u.z=clamp(u.z+u.vz*dt,-HALFZ,HALFZ);u.spd=ml>0?sp:0;
 u.vy-=20*dt;u.y+=u.vy*dt;if(u.y<=0){u.y=0;u.vy=0;if(keys.Space)u.vy=7;}
 for(const v of units){if(v===u||!v.alive)continue;const dx=u.x-v.x,dz=u.z-v.z,d2=dx*dx+dz*dz;if(d2<.5&&d2>1e-5){const d=Math.sqrt(d2),k=(.707-d);u.x+=dx/d*k;u.z+=dz/d*k;}}
 // 攻撃
 if(W.melee){if(mouseL&&u.cd<=0){u.cd=W.cd;swingT=0;setTimeout(()=>{if(player.alive&&curW(player)===w)meleeHit(player,player.yaw,w);},140);}}
 else if(W.bow){if(mouseL&&u.cd<=0&&u.ammo.yumi>0){u.drawing=true;u.draw=Math.min(1,u.draw+dt/W.draw);}
  else if(u.drawing&&!mouseL){const k=u.draw;u.drawing=false;u.draw=0;if(k>.15){u.cd=W.cd;u.ammo.yumi--;const dir=new THREE.Vector3();camera.getWorldDirection(dir);const sp2=18+k*32;
   const e=mouseR?.004:.02;dir.x+=rnd(-e,e);dir.y+=rnd(-e,e);dir.normalize();const o=new THREE.Vector3();camera.getWorldPosition(o);fireArrow(u,o.x,o.y-.05,o.z,dir,sp2);}}}
 else if(W.gun){if(mouseL&&u.cd<=0&&u.loaded.teppo&&u.reloadT<=0){u.cd=W.cd;u.loaded.teppo=0;const dir=new THREE.Vector3();camera.getWorldDirection(dir);const e=(mouseR?.003:.03)+(u.spd>0?.015:0);
   dir.x+=rnd(-e,e);dir.y+=rnd(-e,e);dir.z+=rnd(-e,e);dir.normalize();const o=new THREE.Vector3();camera.getWorldPosition(o);shootRay(u,o,dir);u.pitch+=.06;swingT=0;mouseL=false;if(u.ammo.teppo>0)startReload();}
  else if(mouseL&&!u.loaded.teppo&&u.reloadT<=0&&u.ammo.teppo>0){startReload();mouseL=false;}
  if(u.reloadT>0){u.reloadT-=dt;$('#reload').style.display='block';$('#reload').textContent=`弾込め中… ${u.reloadT.toFixed(1)}秒`;if(u.reloadT<=0){u.loaded.teppo=1;u.ammo.teppo--;$('#reload').style.display='none';}}}
 else if(W.throw){if(mouseL&&u.cd<=0&&u.items.horoku>0){u.cd=W.cd;u.items.horoku--;mouseL=false;swingT=0;const dir=new THREE.Vector3();camera.getWorldDirection(dir);dir.y+=.25;dir.normalize();const o=new THREE.Vector3();camera.getWorldPosition(o);throwBomb(u,o,dir.multiplyScalar(17));
   if(u.items.horoku<=0)setTimeout(()=>{if(player.alive&&curW(player)==='horoku'){player.w=0;setViewWeapon();}},400);}}
 else if(W.heal){if(u.healT>0){u.healT-=dt;$('#reload').style.display='block';$('#reload').textContent=`手当て中… ${u.healT.toFixed(1)}秒`;if(u.healT<=0){u.hp=Math.min(CLS[u.cls].hp,u.hp+W.amt);u.items.sarashi--;$('#reload').style.display='none';sfx('cap');if(u.items.sarashi<=0){u.w=0;setViewWeapon();}}}
  else if(mouseL&&u.items.sarashi>0){mouseL=false;if(u.hp>=CLS[u.cls].hp)flashMsg('傷はない',800);else u.healT=W.time;}}
 const tf=mouseR?(W.gun?35:W.bow?50:72):72;camera.fov+=(tf-camera.fov)*Math.min(1,dt*10);camera.updateProjectionMatrix();
 camera.position.set(u.x,u.y+1.62+Math.abs(Math.sin(u.ph))*.04*(u.spd>0?1:0),u.z);u.ph+=dt*u.spd*1.6;camera.rotation.set(u.pitch,u.yaw,0);
 // 手元の武器の動き
 let px=.32,py=-.32,pz=-.55,rx=0,ry=0,rz=0;if(w==='yumi'){px=-.05;py=-.18;pz=-.6;if(mouseR){px=-.02;py=-.12;}}else if(w==='teppo'){px=mouseR?0:.25;py=mouseR?-.14:-.25;pz=-.45;}
 if(swingT>=0){swingT+=dt/.35;const p=Math.min(1,swingT);if(w==='yari'){pz-=Math.sin(p*Math.PI)*.55;}else if(W.melee){rx=-1.4+p*2.2;rz=.6-p*1.2;px-=p*.3;}else if(w==='teppo'){pz+=Math.sin(p*Math.PI)*.12;}if(swingT>=1)swingT=-1;}
 if(w==='yumi'&&u.drawing)pz+=.05*u.draw;const bob=u.spd>0?Math.sin(u.ph)*.015:0;view.position.set(px+bob,py+Math.abs(bob),pz);view.rotation.set(rx,ry,rz);}
function startReload(){if(player.reloadT>0||player.loaded.teppo||player.ammo.teppo<=0)return;player.reloadT=WPN.teppo.reload;sfx('reload');}

// ================= 入力 =================
addEventListener('keydown',e=>{keys[e.code]=true;if(state!=='play')return;
 if(e.code==='Tab'){e.preventDefault();renderBoard();$('#board').classList.add('on');}
 {const m=/^Digit([1-4])$/.exec(e.code);if(m&&player.alive){const i=+m[1]-1,L=slots(player);if(L[i]!==undefined&&player.w!==i&&!(WPN[L[i]].throw||WPN[L[i]].heal)||L[i]!==undefined&&player.items[L[i]]>0&&player.w!==i){player.w=i;player.drawing=false;player.draw=0;player.healT=0;if(player.reloadT>0){player.reloadT=0;}$('#reload').style.display='none';mouseR=false;setViewWeapon();}}}
 if(e.code==='KeyR'&&player.alive&&curW(player)==='teppo')startReload();});
addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='Tab')$('#board').classList.remove('on');});
canvas.addEventListener('mousedown',e=>{if(state!=='play')return;if(!locked){canvas.requestPointerLock();return;}if(e.button===0)mouseL=true;if(e.button===2&&player.alive){const W=WPN[curW(player)];if(W.bow||W.gun)mouseR=!mouseR;}});
addEventListener('mouseup',e=>{if(e.button===0)mouseL=false;});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouseL=mouseR=false;});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===canvas;if(!locked&&state==='play'){state='pause';$('#pause').classList.add('on');}});
addEventListener('mousemove',e=>{if(state!=='play'||!locked||!player.alive)return;const k=camera.fov/72*.0022;player.yaw-=e.movementX*k;player.pitch=clamp(player.pitch-e.movementY*k,-1.45,1.45);});

// ================= 画面 =================
document.querySelectorAll('#menu [data-team]').forEach(b=>b.onclick=()=>{myTeam=+b.dataset.team;document.querySelectorAll('#menu [data-team]').forEach(x=>x.classList.toggle('sel',x===b));});
$('#bStart').onclick=()=>{initAudio();resetGame();$('#menu').classList.remove('on');$('#hud').style.display='block';state='deploy';openDeploy(true);sfx('horn');};
$('#bResume').onclick=()=>{$('#pause').classList.remove('on');state='play';canvas.requestPointerLock();};
$('#bQuit').onclick=()=>{$('#pause').classList.remove('on');$('#hud').style.display='none';$('#menu').classList.add('on');state='menu';};
$('#bAgain').onclick=()=>{$('#end').classList.remove('on');$('#menu').classList.add('on');state='menu';};
let selCls='samurai',selPt=0;
$('#clsBtns').innerHTML=CLS_KEYS.map(k=>`<button class="btn" data-cls="${k}">${CLS[k].n}<br><small>${CLS[k].w.map(w=>WPN[w].n).join('・')}</small></button>`).join('');
document.querySelectorAll('[data-cls]').forEach(b=>b.onclick=()=>{selCls=b.dataset.cls;renderDeploy();});
$('#spawnmap').onclick=e=>{const r=e.target.getBoundingClientRect(),mx=(e.clientX-r.left)/r.width*260,my=(e.clientY-r.top)/r.height*260;const L=spawnPoints(myTeam);let bi=0,bd=1e9;
 L.forEach((p,i)=>{const[px,py]=mapXY(p.x,p.z,260);const d=Math.hypot(px-mx,py-my);if(d<bd){bd=d;bi=i;}});selPt=bi;renderDeploy();};
$('#bDeploy').onclick=()=>{if(player.respawn>0)return;const L=spawnPoints(myTeam);spawnUnit(player,selCls,L[Math.min(selPt,L.length-1)]);$('#deploy').classList.remove('on');state='play';canvas.requestPointerLock();};
function openDeploy(first){if(document.pointerLockElement)document.exitPointerLock();state='deploy';$('#deploy').classList.add('on');if(first)player.respawn=0;selPt=0;renderDeploy();}
function renderDeploy(){document.querySelectorAll('[data-cls]').forEach(b=>b.classList.toggle('sel',b.dataset.cls===selCls));const L=spawnPoints(myTeam);if(selPt>=L.length)selPt=0;
 $('#spawnT').textContent=player.respawn>0?`出陣まで ${Math.ceil(player.respawn)} 秒`:`出陣地点: ${L[selPt].n}`;$('#bDeploy').style.opacity=player.respawn>0?.4:1;
 const g=$('#spawnmap').getContext('2d');drawMap(g,260,false);L.forEach((p,i)=>{const[x,y]=mapXY(p.x,p.z,260);g.strokeStyle=i===selPt?'#ffe08a':'#fff';g.lineWidth=i===selPt?3:1.5;g.beginPath();g.arc(x,y,i===selPt?11:8,0,6.283);g.stroke();});}
function mapXY(x,z,S){return[(x+HALFX+15)/(2*HALFX+30)*S,(z+HALFZ+15)/(2*HALFZ+30)*S];}
function drawMap(g,S,mini){g.clearRect(0,0,S,S);g.fillStyle='rgba(60,80,40,.9)';g.fillRect(0,0,S,S);
 BASE.forEach((b,t)=>{const[x,y]=mapXY(b.x,b.z,S);g.fillStyle=TEAM[t].css;g.fillRect(x-14,y-6,28,12);});
 FLAGS.forEach(f=>{const[x,y]=mapXY(f.x,f.z,S);g.fillStyle=f.owner<0?'#ddd':TEAM[f.owner].css;g.beginPath();g.arc(x,y,7,0,6.283);g.fill();g.fillStyle='#111';g.font='bold 10px serif';g.textAlign='center';g.textBaseline='middle';g.fillText(f.n,x,y+1);});
 for(const u of units){if(!u.alive)continue;const vis=u.team===myTeam||Math.hypot(u.x-player.x,u.z-player.z)<45;if(!vis)continue;const[x,y]=mapXY(u.x,u.z,S);
  if(u.isPlayer){g.fillStyle='#ffe08a';g.save();g.translate(x,y);g.rotate(-u.yaw);g.beginPath();g.moveTo(0,-6);g.lineTo(4,4);g.lineTo(-4,4);g.closePath();g.fill();g.restore();}
  else{g.fillStyle=TEAM[u.team].css;g.fillRect(x-2,y-2,4,4);}}}
function renderBoard(){const h=[0,1].map(t=>{const L=units.filter(u=>u.team===t).sort((a,b)=>b.kills-a.kills);return`<table><tr><th style="color:${TEAM[t].css}">${TEAM[t].n}（${TEAM[t].lord}）残 ${tickets[t]}</th><th>兵種</th><th>討</th><th>死</th></tr>`+
 L.map(u=>`<tr class="${u.isPlayer?'me':''}"><td>${u.name}</td><td>${CLS[u.cls].n}</td><td>${u.kills}</td><td>${u.deaths}</td></tr>`).join('')+'</table>';});$('#board').innerHTML=h.join('');}
function endGame(win){if(state==='end')return;state='end';if(document.pointerLockElement)document.exitPointerLock();$('#deploy').classList.remove('on');
 $('#endT').textContent=win===myTeam?'勝利！':'敗北…';$('#endT').style.color=TEAM[win].css;$('#endS').textContent=`${TEAM[win].n}（${TEAM[win].lord}方）の勝ち ／ あなた ${player.kills}討 ${player.deaths}死`;$('#end').classList.add('on');sfx('horn');}
function updateHud(){$('#tk0').textContent=`東軍 ${tickets[0]}`;$('#tk1').textContent=`西軍 ${tickets[1]}`;
 $('#flags').innerHTML='<div style="display:flex;gap:6px">'+FLAGS.map(f=>{const p=Math.abs(f.prog),c=f.prog>0?TEAM[0].css:f.prog<0?TEAM[1].css:'#888';return`<div class="fl" style="border-color:${f.owner<0?'#fff':TEAM[f.owner].css}"><i style="height:${p}%;background:${c}"></i><span>${f.n}</span></div>`;}).join('')+'</div>';
 const u=player;$('#hptxt').textContent=`${CLS[u.cls].n}　体力 ${Math.max(0,Math.ceil(u.hp))} / ${CLS[u.cls].hp}`;$('#hpbar i').style.background=u.hp/CLS[u.cls].hp<.3?'#e05a4a':'#e8e0c8';$('#hpbar i').style.width=clamp(u.hp/CLS[u.cls].hp*100,0,100)+'%';
 const w=curW(u),W=WPN[w];$('#ammoN').innerHTML=W.gun?`${u.loaded.teppo?1:0}<small> / ${u.ammo.teppo}</small>`:W.bow?`${u.ammo.yumi}<small> 本</small>`:W.throw?`${u.items.horoku}`:W.heal?`${u.items.sarashi}`:'';$('#wname').textContent=W.n+(mouseR&&(W.bow||W.gun)?'（構え）':'');
 $('#slots').innerHTML=slots(u).map((k,i)=>{const X=WPN[k];const cnt=X.gun?`${(u.loaded.teppo?1:0)+(u.ammo.teppo||0)}`:X.bow?`${u.ammo.yumi}`:X.throw||X.heal?`×${u.items[k]}`:'';const out=(X.throw||X.heal)&&!u.items[k];
  return`<div class="sl${i===u.w?' on':''}${out?' out':''}"><span class="k">${i+1}</span>${X.n}<span class="c">${cnt}</span></div>`;}).join('');
 const f=FLAGS.find(f=>Math.hypot(f.x-u.x,f.z-u.z)<CAP_R);const cap=$('#cap');if(f&&u.alive){cap.style.display='block';const mine=myTeam===0?f.prog:-f.prog;
  $('#captxt').textContent=`旗「${f.n}」 味方${myTeam?f.n1:f.n0}・敵${myTeam?f.n0:f.n1}`+(f.owner===myTeam?'（自軍）':mine>0?'（占領中）':'（奪取中）');const bi=$('#capbar i');bi.style.background=f.prog>0?TEAM[0].css:TEAM[1].css;
  bi.style.width=Math.abs(f.prog)/2+'%';bi.style.left=f.prog>=0?'50%':(50-Math.abs(f.prog)/2)+'%';}else cap.style.display='none';
 drawMap($('#mini').getContext('2d'),170,true);}

// ================= 音 =================
let AC=null;function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function vol(u){if(!u||u.isPlayer)return 1;return clamp(1-Math.hypot(u.x-player.x,u.z-player.z)/120,0,1);}
function noise(dur,f,q,v,t0){const n=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length)**2;
 const s=AC.createBufferSource();s.buffer=n;const fl=AC.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f;fl.Q.value=q;const g=AC.createGain();g.gain.value=v;s.connect(fl);fl.connect(g);g.connect(AC.destination);s.start(AC.currentTime+(t0||0));}
function tone(type,f,f2,dur,v,t0){const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(t0||0);o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.05);}
function sfx(k,u){if(!AC)return;const v=vol(u);if(v<=.02)return;try{
 if(k==='gun'){noise(.6,500,.6,1.1*v);noise(.25,2200,.8,.5*v);}
 else if(k==='bow'){tone('triangle',180,90,.18,.25*v);noise(.15,3000,1,.15*v);}
 else if(k==='slash'){noise(.12,4000,2,.5*v);tone('square',900,500,.08,.08*v);}
 else if(k==='swish'){noise(.18,2500,1.5,.25*v);}
 else if(k==='hurt'){tone('sawtooth',200,90,.2,.18);}
 else if(k==='hitm'){tone('square',1400,1400,.05,.08);}
 else if(k==='cap'){tone('sine',520,520,.25,.2);tone('sine',780,780,.35,.2,.2);}
 else if(k==='reload'){noise(.1,1800,3,.2,0);noise(.1,1200,3,.2,.6);noise(.1,1500,3,.2,1.4);}
 else if(k==='boom'){noise(1.2,180,.5,1.6*v);noise(.4,900,.7,.6*v);}
 else if(k==='horn'){tone('sawtooth',196,180,2.4,.12);tone('sine',392,360,2.4,.08);}}catch(e){}}

// ================= ループ =================
buildWorld();
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;
 if(state==='play'||state==='deploy'){gameT+=dt;
  for(const u of units){u.cd-=dt;u.lastHit+=dt;if(u.alive&&u.lastHit>8&&u.hp<CLS[u.cls].hp)u.hp=Math.min(CLS[u.cls].hp,u.hp+6*dt);
   if(!u.alive){u.respawn-=dt;if(!u.isPlayer&&u.respawn<=0&&tickets[u.team]>0){const L=spawnPoints(u.team);const p=L.length>1&&Math.random()<.6?L[1+Math.floor(Math.random()*(L.length-1))]:L[0];spawnUnit(u,CLS_KEYS[Math.floor(Math.random()*4)],p);}}
   else if(!u.isPlayer)aiUpdate(u,dt);
   animUnit(u,dt);}
  if(state==='play')updatePlayer(dt);else if(state==='deploy'&&$('#deploy').classList.contains('on')){if(Math.floor(player.respawn+dt)!==Math.floor(player.respawn))renderDeploy();
   camera.position.set(BASE[myTeam].x,40,BASE[myTeam].z+(myTeam?-30:30));camera.rotation.set(-.6,myTeam?Math.PI:0,0);}
  updateArrows(dt);updateBombs(dt);updateFx(dt);updateFlags(dt);hudT-=dt;if(hudT<=0){hudT=.12;updateHud();}
  sun.position.set(camera.position.x+60,110,camera.position.z+40);sun.target.position.set(camera.position.x,0,camera.position.z);}
 else if(state==='menu'){gameT+=dt;camera.position.set(Math.sin(gameT*.05)*120,30,Math.cos(gameT*.05)*120);camera.lookAt(0,0,0);}
 view.visible=state==='play'&&player&&player.alive;
 renderer.render(scene,camera);}
let hudT=0;requestAnimationFrame(loop);
</script>
