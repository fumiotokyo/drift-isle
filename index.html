<title>天下分け目 — TENKA WAKEME</title>
<style>
*{box-sizing:border-box}

canvas{display:block}

.scr.on{display:flex}
h1{font-size:64px;margin:0;letter-spacing:.2em;text-shadow:0 3px 0 #000}
.sub{opacity:.7;letter-spacing:.4em;margin-bottom:28px}
.btn{display:inline-block;margin:6px;padding:12px 26px;border:2px solid #d8c8a0;background:rgba(40,30,20,.85);color:#f2ead8;font-size:18px;cursor:pointer;font-family:inherit;min-width:150px}
.btn:hover{background:#5a4630}
.btn.sel{background:#8a6a3a;border-color:#ffe8b0}
.btn.east{border-color:#5a8ae0}.btn.west{border-color:#e05a4a}
.help{margin-top:22px;font-size:14px;opacity:.75;line-height:1.8}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;display:none}
#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px}
#cross:before,#cross:after{content:"";position:absolute;background:rgba(255,255,255,.85)}
#cross:before{left:8px;top:0;width:2px;height:18px}#cross:after{top:8px;left:0;height:2px;width:18px}
#hit{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;opacity:0;border:2px solid #fff;transform:rotate(45deg);transition:opacity .15s}
#top{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;font-size:22px;text-shadow:0 2px 0 #000}
.tk{min-width:90px;padding:4px 10px;border-radius:3px;text-align:center}
#tk0{background:rgba(42,90,168,.75)}#tk1{background:rgba(184,50,42,.75)}
.fl{width:34px;height:34px;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px;position:relative;overflow:hidden;background:#444}
.fl span{position:relative;z-index:2}.fl i{position:absolute;left:0;bottom:0;width:100%;z-index:1}

#hp{position:absolute;left:20px;bottom:16px;width:190px;font-size:14px;text-shadow:0 1px 0 #000}
#hpbar{height:10px;background:rgba(0,0,0,.55);margin-top:3px;border:1px solid rgba(240,230,200,.5)}#hpbar i{display:block;height:100%;background:#e8e0c8;width:100%;transition:width .15s}
#ammo{position:absolute;right:20px;bottom:16px;text-align:right;font-size:15px;text-shadow:0 1px 0 #000}
#ammo b{font-size:34px}#ammo small{font-size:16px;opacity:.75}
#slots{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.sl{width:62px;height:46px;border:1px solid rgba(240,230,200,.45);background:rgba(10,8,6,.45);position:relative;font-size:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1.2}
.sl.on{border:2px solid #ffe8b0;background:rgba(90,70,40,.6)}.sl .k{position:absolute;left:3px;top:1px;font-size:10px;opacity:.8}.sl .c{position:absolute;right:4px;bottom:1px;font-size:11px}.sl.out{opacity:.35}
#feed{position:absolute;right:16px;top:12px;font-size:14px;text-align:right;line-height:1.7;text-shadow:0 1px 0 #000}
#msg{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-size:26px;text-shadow:0 2px 0 #000;opacity:0;transition:opacity .4s;white-space:nowrap}
#mini{position:absolute;left:20px;bottom:52px;border:2px solid rgba(240,230,200,.6);background:rgba(20,30,15,.55)}
#dmg{position:absolute;inset:0;box-shadow:inset 0 0 120px rgba(200,0,0,.0);transition:box-shadow .3s}
#reload{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);font-size:16px;text-shadow:0 1px 0 #000;display:none;text-align:center;min-width:280px}#reload i{display:block;height:5px;background:#e8d8a8;margin-top:4px}
#board{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:15;background:rgba(15,12,8,.88);padding:16px 22px;display:none;gap:26px;font-size:14px}
#board.on{display:flex}#board table{border-collapse:collapse}#board td,#board th{padding:2px 10px;text-align:left;white-space:nowrap}#board tr.me{color:#ffe08a}
#spawnT{margin:10px 0;font-size:18px;min-height:24px}
#spawnmap{border:2px solid #d8c8a0;margin:8px;cursor:pointer;background:#2c3a22}
</style>
</head>
<body>
<div id="hud">
 <canvas id="mini" width="170" height="170"></canvas>
 <div id="dmg"></div>
 <div id="cross"></div><div id="hit"></div>
 <div id="top"><div class="tk" id="tk0">東軍 0</div><div id="flags"></div><div class="tk" id="tk1">西軍 0</div></div>
 <div id="cap"><div id="captxt"></div><div id="capbar"><i></i></div></div>
 <div id="feed"></div><div id="msg"></div><div id="reload"><span id="rlT"></span><i id="rlB"></i></div>
 <div id="hp"><div id="hptxt"></div><div id="hpbar"><i></i></div></div>
 <div id="ammo"><div id="wname"></div><b id="ammoN"></b><div id="slots"></div></div>
</div>
<div id="board"></div>
<div class="scr on" id="menu">
 <h1>天下分け目</h1><div class="sub">TENKA WAKEME ― 関ヶ原 十六対十六</div>
 <div>陣営を選ぶ</div>
 <div><button class="btn east sel" data-team="0">東軍（徳川）</button><button class="btn west" data-team="1">西軍（石田）</button></div>
 <div style="margin-top:14px"><button class="btn" id="bStart">出陣</button></div>
 <div class="help">WASD 移動 / Shift 走る / Space 跳ぶ / マウス 視点<br>左クリック 攻撃・設置（弓は押して引き絞り、離して射る）/ 右クリック 構える・戻す<br>1〜5 持ち替え / R 弾込め / Tab 戦況 / Esc 一時停止<br>中央の旗の周りに留まると占領。相手の兵力（残り兵数）を0にすれば勝ち。</div>
</div>

<div class="scr" id="end"><h1 id="endT" style="font-size:52px"></h1><div id="endS" style="margin:14px"></div><button class="btn" id="bAgain">もう一戦</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// ================= 基本 =================
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const angWrap=a=>Math.atan2(Math.sin(a),Math.cos(a));
const TEAM=[{n:'東軍',c:0x2a5aa8,css:'#3a6ad0',lord:'徳川'},{n:'西軍',c:0xb8322a,css:'#d04a3a',lord:'石田'}];
const HALFX=100,HALFZ=100;
const FLAGS=[{n:'旗',x:0,z:0}];
const BASE=[{x:0,z:88},{x:0,z:-88}];
const CAP_R=12,TICKETS=200,TEAM_N=16;
// 兵種（Battlefield の突撃・援護・看護・狙撃）。w=武器（NPCも使う）、it=道具（数）
const CLS={
 teppo:{n:'鉄砲衆',role:'突撃',hp:100,spd:4.8,w:['teppo','wakizashi'],it:{horoku:2,sarashi:1}},
 kurokuwa:{n:'黒鍬衆',role:'援護',hp:110,spd:4.6,w:['ozutsu','wakizashi'],it:{takeshield:3,horoku:3}},
 kinso:{n:'金創衆',role:'看護',hp:100,spd:5.0,w:['nagayari'],it:{yakuro:2,sarashi:4}},
 yumi:{n:'弓衆',role:'狙撃',hp:90,spd:4.9,w:['yumi','do','wakizashi'],it:{sarashi:1}}};
const CLS_KEYS=Object.keys(CLS);
// 火縄銃の装填（史実の手順）。f=その手順が終わる割合
const RL_STEPS=[[.08,'火縄を火挟みから外し、火蓋を閉じる'],[.15,'銃口を上に立てる'],[.32,'早合を破り、火薬と弾を銃口へ流し込む'],[.62,'槊杖（カルカ）で突き固める'],[.7,'槊杖を銃身の下へ戻す'],
 [.85,'銃を寝かせ、火皿に口薬を盛って火蓋を閉じる'],[.97,'火縄を火挟みに挟み、火口を吹く'],[1,'構える']];
const WPN={
 wakizashi:{n:'脇差',melee:1,dmg:30,range:2.1,cd:.55,ang:.7},
 nagayari:{n:'長槍',melee:1,dmg:40,range:4.6,cd:1.1,ang:.4,thrust:1},
 yumi:{n:'弓',bow:1,dmg:35,cd:.9,ammo:30,draw:.8},
 do:{n:'弩',xbow:1,dmg:55,ammo:20,reload:3,spd:66},
 teppo:{n:'火縄銃',gun:1,dmg:45,cd:.3,ammo:20,reload:20,range:160,matchlock:1},
 ozutsu:{n:'大筒',cannon:1,dmg:130,rad:4.5,sdmg:600,ammo:3,reload:25,spd:40,heavy:1,matchlock:1},
 horoku:{n:'焙烙玉',throw:1,dmg:110,rad:7,sdmg:200,fuse:2.6,cd:1,item:1},
 sarashi:{n:'さらし',heal:1,amt:60,time:2.5,cd:.5,item:1},
 takeshield:{n:'竹束',place:'take',item:1},
 yakuro:{n:'薬籠',place:'yakuro',item:1}};
const NAMES=['太郎兵衛','与四郎','弥助','源八','権六','孫三郎','甚五郎','又兵衛','新左衛門','彦七','藤吉','半蔵','喜平次','左近','勘助','市松','虎之助','才蔵','十兵衛','茂助','吉蔵','伝八','清右衛門','久六','八郎','長吉','小平太','善兵衛','佐吉','忠三郎','五郎作','平八'];

// ================= three.js =================
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
const canvas=renderer.domElement;
const scene=new THREE.Scene();scene.background=new THREE.Color(0xbcd6e8);scene.fog=new THREE.Fog(0xbcd6e8,60,260);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,600);camera.rotation.order='YXZ';scene.add(camera);
scene.add(new THREE.HemisphereLight(0xdfeeff,0x5a6a3a,.75));
const sun=new THREE.DirectionalLight(0xfff2dc,.85);sun.position.set(60,110,40);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-80,right:80,top:80,bottom:-80,near:10,far:300});scene.add(sun);scene.add(sun.target);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
const MAT=new THREE.MeshLambertMaterial({vertexColors:true});
// 部品をまとめて1つのジオメトリにする（頂点色つき）
function P(geo,col,o){o=o||{};const g=geo.index?geo.toNonIndexed():geo.clone();
 g.applyMatrix4(new THREE.Matrix4().compose(new THREE.Vector3(o.x||0,o.y||0,o.z||0),new THREE.Quaternion().setFromEuler(new THREE.Euler(o.rx||0,o.ry||0,o.rz||0)),new THREE.Vector3(o.sx||1,o.sy||1,o.sz||1)));
 const c=new THREE.Color(col),n=g.attributes.position.count,a=new Float32Array(n*3);for(let i=0;i<n;i++){a[i*3]=c.r;a[i*3+1]=c.g;a[i*3+2]=c.b;}g.setAttribute('color',new THREE.BufferAttribute(a,3));return g;}
function M(parts){let n=0;parts.forEach(g=>n+=g.attributes.position.count);const pos=new Float32Array(n*3),nor=new Float32Array(n*3),col=new Float32Array(n*3);let o=0;
 parts.forEach(g=>{pos.set(g.attributes.position.array,o*3);nor.set(g.attributes.normal.array,o*3);col.set(g.attributes.color.array,o*3);o+=g.attributes.position.count;});
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('normal',new THREE.BufferAttribute(nor,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));return g;}
const B=(w,h,d,c,o)=>P(new THREE.BoxGeometry(w,h,d),c,o);
const CY=(r,h,c,o,n)=>P(new THREE.CylinderGeometry(r,r,h,n||6),c,o);
const mesh=(g,sh)=>{const m=new THREE.Mesh(g,MAT);m.castShadow=sh!==false;m.receiveShadow=true;return m;};

// ================= 地面と装飾 =================
function buildWorld(){
 const S=300,N=60,g=new THREE.PlaneGeometry(S*2,S*2,N,N);g.rotateX(-Math.PI/2);const ng=g.toNonIndexed();const pa=ng.attributes.position.array,col=new Float32Array(pa.length),c=new THREE.Color();
 for(let i=0;i<pa.length;i+=9){const x=(pa[i]+pa[i+3]+pa[i+6])/3,z=(pa[i+2]+pa[i+5]+pa[i+8])/3;const n=Math.sin(x*.05)*Math.cos(z*.043)+Math.sin(x*.13+z*.09)*.5;
  c.set(Math.abs(x)>HALFX||Math.abs(z)>HALFZ?'#6e8a46':'#7d9a4a').offsetHSL(0,0,n*.025+(Math.random()-.5)*.02);for(let k=0;k<3;k++){col[i+k*3]=c.r;col[i+k*3+1]=c.g;col[i+k*3+2]=c.b;}}
 ng.setAttribute('color',new THREE.BufferAttribute(col,3));ng.computeVertexNormals();const gm=new THREE.Mesh(ng,MAT);gm.receiveShadow=true;scene.add(gm);
 const tg=M([B(.4,3,.4,'#5a4030',{y:1.5}),P(new THREE.ConeGeometry(2.2,4.5,7),'#3e6a2c',{y:4.6}),P(new THREE.ConeGeometry(1.7,3.5,7),'#4a7a34',{y:6.4})]);
 const T=[];for(let k=0;k<300;k++){const a=Math.random()*6.283,r=rnd(125,240);T.push([Math.cos(a)*r,Math.sin(a)*r]);}
 for(let k=0;k<50;k++){T.push([rnd(-1,1)*HALFX,(Math.random()<.5?1:-1)*rnd(104,122)]);T.push([(Math.random()<.5?1:-1)*rnd(104,122),rnd(-1,1)*HALFZ]);}
 const im=new THREE.InstancedMesh(tg,MAT,T.length);im.castShadow=true;const m4=new THREE.Matrix4(),q=new THREE.Quaternion(),v=new THREE.Vector3(),sc=new THREE.Vector3();
 T.forEach(([x,z],i)=>{const s=rnd(.8,1.4);q.setFromAxisAngle(new THREE.Vector3(0,1,0),Math.random()*6);m4.compose(v.set(x,0,z),q,sc.set(s,s,s));im.setMatrixAt(i,m4);});scene.add(im);
 BASE.forEach((b,t)=>{const s=t?-1:1;const curtain=M([B(26,2.2,.15,'#f2ece0',{y:1.1}),B(26,.5,.16,TEAM[t].css,{y:.5}),B(26,.5,.16,TEAM[t].css,{y:1.8}),P(new THREE.CircleGeometry(.7,16),'#1a1a1a',{y:1.15,z:.09*s,ry:t?Math.PI:0})]);
  const c1=mesh(curtain);c1.position.set(b.x,0,b.z+10*s);scene.add(c1);
  for(const sx of[-1,1]){const c2=mesh(M([B(14,2.2,.15,'#f2ece0',{y:1.1}),B(14,.5,.16,TEAM[t].css,{y:.5}),B(14,.5,.16,TEAM[t].css,{y:1.8})]));c2.position.set(b.x+sx*13,0,b.z+3*s);c2.rotation.y=Math.PI/2;scene.add(c2);}
  for(let k=0;k<8;k++){const n=mesh(M([B(.08,5,.08,'#3a2a1a',{y:2.5}),B(.06,.06,1.0,'#3a2a1a',{y:4.9,z:.5}),B(.04,3.4,1.0,TEAM[t].css,{y:3.2,z:.5}),B(.045,.5,1.0,'#f2ece0',{y:4.4,z:.5})]));n.position.set(b.x-12+k*24/7,0,b.z-6*s);n.rotation.y=Math.random()*.4;scene.add(n);}});
 FLAGS.forEach(f=>{const g=new THREE.Group();g.add(mesh(M([B(.16,7,.16,'#4a3a2a',{y:3.5}),P(new THREE.CylinderGeometry(1.2,1.5,.4,8),'#8a7a5a',{y:.2})])));
  const cv=document.createElement('canvas');cv.width=cv.height=64;const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,64,64);cx.fillStyle='#111';cx.font='bold 44px serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(f.n,32,34);
  const mat=new THREE.MeshLambertMaterial({map:new THREE.CanvasTexture(cv),side:THREE.DoubleSide,color:0xdddddd});const ban=new THREE.Mesh(new THREE.PlaneGeometry(1.6,3.2),mat);ban.position.set(0,5,.85);ban.rotation.y=Math.PI/2;ban.castShadow=true;g.add(ban);
  const ring=new THREE.Mesh(new THREE.RingGeometry(CAP_R-.25,CAP_R,64),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.35}));ring.rotation.x=-Math.PI/2;ring.position.y=.03;g.add(ring);
  g.position.set(f.x,0,f.z);scene.add(g);f.mat=mat;f.ring=ring;f.ban=ban;});
}

// ================= 構造物（木柵・竹束・薬籠）=================
// s={kind,x,z,yaw,hw,hd,h,hp,mesh}。局所座標の x が幅、z が厚み
const structs=[];
const STD={saku:{hw:2.6,hd:.18,h:1.3,hp:400},take:{hw:.85,hd:.3,h:1.75,hp:160},yakuro:{hw:.3,hd:.22,h:.35,hp:60,soft:1}};
function structGeo(k){if(k==='saku'){const p=[];for(let i=0;i<5;i++)p.push(B(.14,1.5,.14,'#6a4a30',{x:-2.4+i*1.2,y:.75}));p.push(B(5.2,.12,.08,'#7a5a3a',{y:.45,z:.08}),B(5.2,.12,.08,'#7a5a3a',{y:1.05,z:.08}));
  for(let i=0;i<9;i++)p.push(B(.07,1.25,.05,'#8a6a44',{x:-2.4+i*.6,y:.7,z:.14,rz:(i%2?.1:-.1)}));return M(p);}
 if(k==='take'){const p=[];for(let r=0;r<2;r++)for(let i=0;i<7;i++)p.push(CY(.11,1.75,i%3?'#9aa850':'#b0b860',{x:-.66+i*.22+(r?.11:0),y:.875,z:r?-.1:.1},7));
  p.push(B(1.75,.06,.36,'#c8a878',{y:.5}),B(1.75,.06,.36,'#c8a878',{y:1.3}),B(.07,1.7,.07,'#6a4a30',{y:.7,z:-.55,rx:.5}));return M(p);}
 return M([B(.55,.3,.4,'#3a2a20',{y:.15}),B(.57,.05,.42,'#a8323a',{y:.31}),B(.1,.1,.02,'#f2ece0',{y:.18,z:.21})]);}
function addStruct(kind,x,z,yaw,team){const d=STD[kind];const m=mesh(structGeo(kind));m.position.set(x,0,z);m.rotation.y=yaw;scene.add(m);const s={kind,x,z,yaw,hw:d.hw,hd:d.hd,h:d.h,hp:d.hp,team,mesh:m,t:0};structs.push(s);return s;}
function removeStruct(s){scene.remove(s.mesh);const i=structs.indexOf(s);if(i>=0)structs.splice(i,1);}
function hurtStruct(s,d){if(STD[s.kind].soft)return;s.hp-=d;if(s.hp<=0){for(let k=0;k<6;k++)splinter(s);removeStruct(s);sfx('crash',s);}}
const toLocal=(s,x,z)=>{const dx=x-s.x,dz=z-s.z,c=Math.cos(s.yaw),n=Math.sin(s.yaw);return[dx*c-dz*n,dx*n+dz*c];};
function structAt(x,y,z,pad){for(const s of structs){if(STD[s.kind].soft)continue;if(y>s.h)continue;const[lx,lz]=toLocal(s,x,z);if(Math.abs(lx)<s.hw+(pad||0)&&Math.abs(lz)<s.hd+(pad||0))return s;}return null;}
// 光線と箱（局所座標でスラブ判定）。当たった距離と構造物
function rayStruct(o,d,maxT){let best=null,bt=maxT;for(const s of structs){if(STD[s.kind].soft)continue;const c=Math.cos(s.yaw),n=Math.sin(s.yaw);const dx=o.x-s.x,dz=o.z-s.z;
  const O=[dx*c-dz*n,o.y,dx*n+dz*c],D=[d.x*c-d.z*n,d.y,d.x*n+d.z*c],lo=[-s.hw,0,-s.hd],hi=[s.hw,s.h,s.hd];let t0=0,t1=bt,ok=true;
  for(let a=0;a<3;a++){if(Math.abs(D[a])<1e-9){if(O[a]<lo[a]||O[a]>hi[a]){ok=false;break;}continue;}let ta=(lo[a]-O[a])/D[a],tb=(hi[a]-O[a])/D[a];if(ta>tb)[ta,tb]=[tb,ta];t0=Math.max(t0,ta);t1=Math.min(t1,tb);if(t0>t1){ok=false;break;}}
  if(ok&&t0<bt){bt=t0;best=s;}}return best?{s:best,t:bt}:null;}

function collideStructs(u,r){for(const s of structs){if(STD[s.kind].soft||u.y>s.h-.2)continue;const[lx,lz]=toLocal(s,u.x,u.z);const px=s.hw+r-Math.abs(lx),pz=s.hd+r-Math.abs(lz);if(px<=0||pz<=0)continue;
  let nx=lx,nz=lz;if(px<pz)nx=Math.sign(lx||1)*(s.hw+r);else nz=Math.sign(lz||1)*(s.hd+r);const c=Math.cos(s.yaw),n=Math.sin(s.yaw);u.x=s.x+nx*c+nz*n;u.z=s.z-nx*n+nz*c;}}

 for(let k=0;k<8;k++){const a=k*Math.PI/4+Math.PI/8,r=17;addStruct('saku',Math.cos(a)*r,Math.sin(a)*r,-a-Math.PI/2,-1);}

   else if(st===5){rFlask.visible=lp>.3;rFlask.position.set(px-.04,py+.12,pz-.02);rFlask.rotation.z=lp>.55?1.9:0;rHand.position.set(px+.06,py+.1,pz+.1);}
   else if(st===6){rCord.visible=true;rCord.position.set(px-.25+lp*.22,py+.06,pz-.02);rCord.rotation.y=-.9;rHand.position.set(px-.29+lp*.22,py+.01,pz+.04);}
   $('#rlT').textContent=`弾込め（${st+1}/${RL_STEPS.length}）${RL_STEPS[st][1]}　あと${u.reloadT.toFixed(1)}秒`;}
  else{px=.2;py=-.4;rx=-.6;$('#rlT').textContent=`弦を引いて矢を番える… ${u.reloadT.toFixed(1)}秒`;}
  $('#rlB').style.width=(p*100)+'%';$('#reload').style.display='block';}
 else if(u.healT>0){$('#rlT').textContent=`さらしで手当て中… ${u.healT.toFixed(1)}秒`;$('#rlB').style.width=((1-u.healT/WPN.sarashi.time)*100)+'%';$('#reload').style.display='block';}
 else $('#reload').style.display='none';
 const bob=u.spd>0?Math.sin(u.ph)*.015:0;view.position.set(0,0,0);viewM.position.set(px+bob,py+Math.abs(bob),pz);viewM.rotation.set(rx,ry,rz);}
function switchSlot(i){const u=player,L=slots(u);if(L[i]===undefined||u.w===i)return;const k=L[i];if(WPN[k].item&&!(u.items[k]>0))return;
 u.w=i;u.drawing=false;u.draw=0;u.healT=0;cancelReload(u);aimOn=false;setViewWeapon();}

// ================= 入力 =================
addEventListener('keydown',e=>{keys[e.code]=true;if(state!=='play')return;
 if(e.code==='Tab'){e.preventDefault();renderBoard();$('#board').classList.add('on');}
 const m=/^Digit([1-5])$/.exec(e.code);if(m&&player.alive)switchSlot(+m[1]-1);
 if(e.code==='KeyR'&&player.alive)startReload(player);});
addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='Tab')$('#board').classList.remove('on');});
canvas.addEventListener('mousedown',e=>{if(state!=='play')return;if(!locked){canvas.requestPointerLock();return;}if(e.button===0)mouseL=true;
 if(e.button===2&&player.alive){const W=WPN[curW(player)];if((W.bow||W.gun||W.cannon||W.xbow)&&player.reloadT<=0)aimOn=!aimOn;}});
addEventListener('mouseup',e=>{if(e.button===0)mouseL=false;});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouseL=false;});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===canvas;if(!locked&&state==='play'){state='pause';$('#pause').classList.add('on');}});
addEventListener('mousemove',e=>{if(state!=='play'||!locked||!player.alive)return;const k=camera.fov/72*.0022;player.yaw-=e.movementX*k;player.pitch=clamp(player.pitch-e.movementY*k,-1.45,1.45);});

// ================= 画面 =================
document.querySelectorAll('#menu [data-team]').forEach(b=>b.onclick=()=>{myTeam=+b.dataset.team;document.querySelectorAll('#menu [data-team]').forEach(x=>x.classList.toggle('sel',x===b));});
$('#bStart').onclick=()=>{initAudio();resetGame();$('#menu').classList.remove('on');$('#hud').style.display='block';state='deploy';openDeploy(true);sfx('horn');};
$('#bResume').onclick=()=>{$('#pause').classList.remove('on');state='play';canvas.requestPointerLock();};
$('#bQuit').onclick=()=>{$('#pause').classList.remove('on');$('#hud').style.display='none';$('#menu').classList.add('on');state='menu';};
$('#bAgain').onclick=()=>{$('#end').classList.remove('on');$('#menu').classList.add('on');state='menu';};
let selCls='teppo',selPt=0;
$('#clsBtns').innerHTML=CLS_KEYS.map(k=>{const c=CLS[k];return`<button class="btn" data-cls="${k}">${c.n}（${c.role}）<br><small>${[...c.w.map(w=>WPN[w].n),...Object.keys(c.it).map(i=>WPN[i].n+'×'+c.it[i])].join('・')}</small></button>`;}).join('');
document.querySelectorAll('[data-cls]').forEach(b=>b.onclick=()=>{selCls=b.dataset.cls;renderDeploy();});
$('#spawnmap').onclick=e=>{const r=e.target.getBoundingClientRect(),S=240,mx=(e.clientX-r.left)/r.width*S,my=(e.clientY-r.top)/r.height*S;const L=spawnPoints(myTeam);let bi=0,bd=1e9;
 L.forEach((p,i)=>{const[px,py]=mapXY(p.x,p.z,S);const d=Math.hypot(px-mx,py-my);if(d<bd){bd=d;bi=i;}});selPt=bi;renderDeploy();};
$('#bDeploy').onclick=()=>{if(player.respawn>0)return;const L=spawnPoints(myTeam);spawnUnit(player,selCls,L[Math.min(selPt,L.length-1)]);$('#deploy').classList.remove('on');state='play';canvas.requestPointerLock();};
function openDeploy(first){if(document.pointerLockElement)document.exitPointerLock();state='deploy';$('#deploy').classList.add('on');if(first)player.respawn=0;selPt=0;renderDeploy();}
function renderDeploy(){document.querySelectorAll('[data-cls]').forEach(b=>b.classList.toggle('sel',b.dataset.cls===selCls));const L=spawnPoints(myTeam);if(selPt>=L.length)selPt=0;
 $('#spawnT').textContent=player.respawn>0?`出陣まで ${Math.ceil(player.respawn)} 秒`:`出陣地点: ${L[selPt].n}`;$('#bDeploy').style.opacity=player.respawn>0?.4:1;
 const g=$('#spawnmap').getContext('2d');drawMap(g,240);L.forEach((p,i)=>{const[x,y]=mapXY(p.x,p.z,240);g.strokeStyle=i===selPt?'#ffe08a':'#fff';g.lineWidth=i===selPt?3:1.5;g.beginPath();g.arc(x,y,i===selPt?11:8,0,6.283);g.stroke();});}
function mapXY(x,z,S){return[(x+HALFX+8)/(2*HALFX+16)*S,(z+HALFZ+8)/(2*HALFZ+16)*S];}
function drawMap(g,S){g.clearRect(0,0,S,S);g.fillStyle='rgba(60,80,40,.9)';g.fillRect(0,0,S,S);const k=S/(2*HALFX+16);
 BASE.forEach((b,t)=>{const[x,y]=mapXY(b.x,b.z,S);g.fillStyle=TEAM[t].css;g.fillRect(x-26*k,y-5*k,52*k,10*k);});
 for(const s of structs){if(s.kind==='yakuro')continue;const[x,y]=mapXY(s.x,s.z,S);g.save();g.translate(x,y);g.rotate(-s.yaw);g.fillStyle=s.kind==='take'?'#c8d080':'#a08060';g.fillRect(-s.hw*k,-Math.max(1,s.hd*k),s.hw*2*k,Math.max(2,s.hd*2*k));g.restore();}
 FLAGS.forEach(f=>{const[x,y]=mapXY(f.x,f.z,S);g.strokeStyle='rgba(255,255,255,.4)';g.beginPath();g.arc(x,y,CAP_R*k,0,6.283);g.stroke();g.fillStyle=f.owner<0?'#ddd':TEAM[f.owner].css;g.beginPath();g.arc(x,y,7,0,6.283);g.fill();g.fillStyle='#111';g.font='bold 10px serif';g.textAlign='center';g.textBaseline='middle';g.fillText(f.n,x,y+1);});
 for(const u of units){if(!u.alive)continue;const vis=u.team===myTeam||Math.hypot(u.x-player.x,u.z-player.z)<40;if(!vis)continue;const[x,y]=mapXY(u.x,u.z,S);
  if(u.isPlayer){g.fillStyle='#ffe08a';g.save();g.translate(x,y);g.rotate(-u.yaw);g.beginPath();g.moveTo(0,-6);g.lineTo(4,4);g.lineTo(-4,4);g.closePath();g.fill();g.restore();}
  else{g.fillStyle=TEAM[u.team].css;g.fillRect(x-2,y-2,4,4);}}}
function renderBoard(){const h=[0,1].map(t=>{const L=units.filter(u=>u.team===t).sort((a,b)=>b.kills-a.kills);return`<table><tr><th style="color:${TEAM[t].css}">${TEAM[t].n}（${TEAM[t].lord}）残 ${tickets[t]}</th><th>兵種</th><th>討</th><th>死</th></tr>`+
 L.map(u=>`<tr class="${u.isPlayer?'me':''}"><td>${u.name}</td><td>${CLS[u.cls].n}</td><td>${u.kills}</td><td>${u.deaths}</td></tr>`).join('')+'</table>';});$('#board').innerHTML=h.join('');}
function endGame(win){if(state==='end')return;state='end';if(document.pointerLockElement)document.exitPointerLock();$('#deploy').classList.remove('on');
 $('#endT').textContent=win===myTeam?'勝利！':'敗北…';$('#endT').style.color=TEAM[win].css;$('#endS').textContent=`${TEAM[win].n}（${TEAM[win].lord}方）の勝ち ／ あなた ${player.kills}討 ${player.deaths}死`;$('#end').classList.add('on');sfx('horn');}
function updateHud(){$('#tk0').textContent=`東軍 ${tickets[0]}`;$('#tk1').textContent=`西軍 ${tickets[1]}`;
 $('#flags').innerHTML='<div style="display:flex;gap:6px">'+FLAGS.map(f=>{const p=Math.abs(f.prog),c=f.prog>0?TEAM[0].css:f.prog<0?TEAM[1].css:'#888';return`<div class="fl" style="border-color:${f.owner<0?'#fff':TEAM[f.owner].css}"><i style="height:${p}%;background:${c}"></i><span>${f.n}</span></div>`;}).join('')+'</div>';
 const u=player,mx=CLS[u.cls].hp;$('#hptxt').textContent=`${CLS[u.cls].n}（${CLS[u.cls].role}）体力 ${Math.max(0,Math.ceil(u.hp))} / ${mx}`;$('#hpbar i').style.width=clamp(u.hp/mx*100,0,100)+'%';$('#hpbar i').style.background=u.hp/mx<.3?'#e05a4a':'#e8e0c8';
 const w=curW(u),W=WPN[w];$('#ammoN').innerHTML=W.bow?`${u.ammo[w]}<small> 本</small>`:W.ammo?`${u.loaded[w]?1:0}<small> / ${u.ammo[w]}</small>`:W.item?`${u.items[w]||0}`:'';
 $('#wname').textContent=W.n+(aimOn?'（構え）':'')+(W.heavy?'　重い（構え中は動けない）':'');
 $('#slots').innerHTML=slots(u).map((k,i)=>{const X=WPN[k];const cnt=X.bow?`${u.ammo[k]}`:X.ammo?`${(u.loaded[k]?1:0)+(u.ammo[k]||0)}`:X.item?`×${u.items[k]||0}`:'';const out=X.item&&!u.items[k];
  return`<div class="sl${i===u.w?' on':''}${out?' out':''}"><span class="k">${i+1}</span>${X.n}<span class="c">${cnt}</span></div>`;}).join('');
 const f=FLAGS.find(f=>Math.hypot(f.x-u.x,f.z-u.z)<CAP_R);const cap=$('#cap');if(f&&u.alive){cap.style.display='block';const mine=myTeam===0?f.prog:-f.prog;
  $('#captxt').textContent=`旗 味方${myTeam?f.n1:f.n0}・敵${myTeam?f.n0:f.n1}`+(f.owner===myTeam?'（自軍）':mine>0?'（占領中）':'（奪取中）');const bi=$('#capbar i');bi.style.background=f.prog>0?TEAM[0].css:TEAM[1].css;
  bi.style.width=Math.abs(f.prog)/2+'%';bi.style.left=f.prog>=0?'50%':(50-Math.abs(f.prog)/2)+'%';}else cap.style.display='none';
 drawMap($('#mini').getContext('2d'),170);}
// 薬籠: 周りの味方を回復、時間で消える
function updateStructs(dt){for(const s of structs.slice()){if(s.kind!=='yakuro')continue;s.life-=dt;if(s.life<=0){removeStruct(s);continue;}
 for(const u of units)if(u.alive&&u.team===s.team&&Math.hypot(u.x-s.x,u.z-s.z)<4)u.hp=Math.min(CLS[u.cls].hp,u.hp+8*dt);}}

// ================= 音 =================
let AC=null;function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function vol(u){if(!u||u.isPlayer||!player)return 1;return clamp(1-Math.hypot(u.x-player.x,u.z-player.z)/120,0,1);}
function noise(dur,f,q,v,t0){const n=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length)**2;
 const s=AC.createBufferSource();s.buffer=n;const fl=AC.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f;fl.Q.value=q;const g=AC.createGain();g.gain.value=v;s.connect(fl);fl.connect(g);g.connect(AC.destination);s.start(AC.currentTime+(t0||0));}
function tone(type,f,f2,dur,v,t0){const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(t0||0);o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.05);}
function sfx(k,u){if(!AC)return;const v=vol(u);if(v<=.02)return;try{
 if(k==='gun'){noise(.6,500,.6,1.1*v);noise(.25,2200,.8,.5*v);}
 else if(k==='cannon'){noise(1.4,140,.5,1.8*v);noise(.5,600,.7,.8*v);}
 else if(k==='boom'){noise(1.2,180,.5,1.6*v);noise(.4,900,.7,.6*v);}
 else if(k==='bow'){tone('triangle',180,90,.18,.25*v);noise(.15,3000,1,.15*v);}
 else if(k==='xbow'){tone('square',140,70,.12,.2*v);noise(.1,2000,1,.3*v);}
 else if(k==='slash'){noise(.12,4000,2,.5*v);tone('square',900,500,.08,.08*v);}
 else if(k==='swish'){noise(.18,2500,1.5,.25*v);}
 else if(k==='thud'){noise(.12,400,1.5,.4*v);}
 else if(k==='crash'){noise(.8,300,.6,1.0*v);noise(.5,1200,.8,.5*v);}
 else if(k==='place'){noise(.15,500,2,.4*v);}
 else if(k==='hurt'){tone('sawtooth',200,90,.2,.18);}
 else if(k==='hitm'){tone('square',1400,1400,.05,.08);}
 else if(k==='cap'){tone('sine',520,520,.25,.2);tone('sine',780,780,.35,.2,.2);}
 else if(k==='click'){noise(.06,1800,3,.25);}
 else if(k==='ram'){for(let i=0;i<3;i++)noise(.08,900,4,.3,i*.6);}
 else if(k==='horn'){tone('sawtooth',196,180,2.4,.12);tone('sine',392,360,2.4,.08);}}catch(e){}}

// ================= ループ =================
buildWorld();
let last=performance.now(),hudT=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;
 if(state==='play'||state==='deploy'){gameT+=dt;
  for(const u of units){u.cd-=dt;u.lastHit+=dt;if(u.alive&&u.lastHit>8&&u.hp<CLS[u.cls].hp)u.hp=Math.min(CLS[u.cls].hp,u.hp+6*dt);
   if(!u.alive){u.respawn-=dt;if(!u.isPlayer&&u.respawn<=0&&tickets[u.team]>0){const L=spawnPoints(u.team);const p=L.length>1&&Math.random()<.6?L[1]:L[0];spawnUnit(u,CLS_KEYS[Math.floor(Math.random()*4)],p);}}
   else if(!u.isPlayer)aiUpdate(u,dt);
   animUnit(u,dt);}
  if(state==='play')updatePlayer(dt);else if(state==='deploy'&&$('#deploy').classList.contains('on')){if(Math.floor(player.respawn+dt)!==Math.floor(player.respawn))renderDeploy();
   camera.position.set(BASE[myTeam].x,35,BASE[myTeam].z+(myTeam?-25:25));camera.rotation.set(-.6,myTeam?Math.PI:0,0);}
  updateArrows(dt);updateBombs(dt);updateStructs(dt);updateFx(dt);updateFlags(dt);hudT-=dt;if(hudT<=0){hudT=.12;updateHud();}
  sun.position.set(camera.position.x+60,110,camera.position.z+40);sun.target.position.set(camera.position.x,0,camera.position.z);}
 else if(state==='menu'){gameT+=dt;camera.position.set(Math.sin(gameT*.05)*80,25,Math.cos(gameT*.05)*80);camera.lookAt(0,0,0);}
 view.visible=state==='play'&&player&&player.alive;
 renderer.render(scene,camera);}
requestAnimationFrame(loop);
</script>
